<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Clock qualification</title>
  <!-- ES5 ONLY (must run in iPad-1 Safari 5.1). Ground-truth ladder v1: XHR. -->
  <script src="/js/clockdiag/analysis.js"></script>
  <script src="/js/clockdiag/probe-xhr.js"></script>
  <script src="/js/clockdiag/render.js"></script>
</head>
<body style="margin:0;background:#f6f6f6">
  <div id="out" style="font:16px -apple-system,Helvetica,Arial,sans-serif;padding:20px;text-align:center;color:#666">
    starting clock qualification…
  </div>
  <script>
  (function () {
    var URL = '/clockprobe';
    // URL-configurable window (ES5; no URLSearchParams on Safari 5.1). Default
    // ~60s (RTT/jitter/path). For a TRUSTED oscillator-skew number the drift must
    // beat the offset noise -> run several minutes, e.g. ?probes=1500&interval=400
    // (~10 min); the skew reports "run longer" until confident.
    function qp(name, dflt) {
      var m = new RegExp('[?&]' + name + '=([0-9]+)').exec(location.search || '');
      return m ? parseInt(m[1], 10) : dflt;
    }
    var TOTAL = qp('probes', 300);
    var INTERVAL = qp('interval', 200);
    var RENDER_EVERY = 10;

    var out = document.getElementById('out');
    var samples = [];
    var sent = 0, failed = 0;

    // --- clock source (report only; probes use Date for epoch compatibility) ---
    var clockSource = (window.performance && typeof window.performance.now === 'function')
      ? 'performance.now (monotonic)' : 'Date.getTime (wall-clock)';

    // --- main-thread timer jitter: fixed 100ms interval, measure firing error ---
    var TJ_PERIOD = 100, tjExpected = null, tjErrs = [];
    function nowHi() { return (window.performance && performance.now) ? performance.now() : (new Date()).getTime(); }
    var tjTimer = setInterval(function () {
      var t = nowHi();
      if (tjExpected !== null) { tjErrs.push(t - tjExpected); }
      tjExpected = t + TJ_PERIOD;
    }, TJ_PERIOD);
    function timerJitter() {
      if (tjErrs.length < 3) { return null; }
      return window._mmClockHelpers.pstdev(tjErrs);
    }

    function draw(done) {
      var stats = window.mmClockStats(samples);
      var verdicts = window.mmClockVerdicts(stats);
      var tj = timerJitter();
      var tjV = (tj === null) ? null
        : { value: tj, unit: 'ms std', verdict: (tj < 20 ? 'PASS' : (tj < 60 ? 'WARN' : 'FAIL')) };
      window.mmClockRender(out, stats, verdicts, {
        progress: samples.length, total: TOTAL, failed: failed, done: done,
        timerJitterMs: tj, timerVerdict: tjV, clockSource: clockSource
      });
    }

    function report() {
      // fire-and-forget: send the final stats back so the server can collect
      // results from a whole fleet at once (keyed by request IP server-side).
      try {
        var stats = window.mmClockStats(samples);
        var dump = { n: stats.n, rtt: stats.rtt, offset: stats.offset,
          offsetJitter: stats.offsetJitter, skew: stats.skew,
          jitter: stats.jitter, timerJitterMs: timerJitter(),
          clockSource: clockSource, failed: failed };
        var x = new XMLHttpRequest();
        x.open('GET', '/clockresult?d=' + encodeURIComponent((function(){try{return JSON.stringify(dump);}catch(e){return '{}';}})()), true);
        x.send();
      } catch (e) {}
    }

    function step() {
      if (sent >= TOTAL) {
        clearInterval(tjTimer);
        draw(true);
        report();
        return;
      }
      sent++;
      window.mmXhrProbe(URL, function (s) {
        if (s) { samples.push(s); } else { failed++; }
        if ((samples.length + failed) % RENDER_EVERY === 0) { draw(false); }
      });
      setTimeout(step, INTERVAL);
    }

    // kick off (small delay so the first render shows)
    setTimeout(step, 300);
  })();
  </script>
</body>
</html>
