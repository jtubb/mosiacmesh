<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.16/themes/default/style.min.css" />
  <script src="/js/jquery.min.js"></script>
  <script src="/js/sockjs.min.js"></script>
  <script src="/js/GoTime.js"></script> 
  <script src="/js/mosiacmesh.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.16/jstree.min.js"></script>
  <script>
    function tickcallback(currentTime,currentTarget,drift_correction)
    {
        if(sock == null)
        {
            mosiacMeshConnect();
        }
    }
	
	$('form').submit(function() {
		var text = generateMessage("SRV",$('#text').val(),"");
        log('Sending: ' + text);
        sock.send(text);
        $('#text').val('').focus();
        return false;
    });
	
	function mosiacMeshCallback(data_obj)
	{
		if(data_obj.REQUEST == "REGISTER" && data_obj.PAYLOAD == "SUCCESS")
		{
			refreshClients();
		}
		else if(data_obj.REQUEST == "DISPLAYS")
		{
			console.log(data_obj.PAYLOAD);
			displays = [{
					'id' : 'displays',
					'text' : 'Displays',
					'state' : { 'opened' : true, 'selected' : false },
					'children' : [],
					'icon': 'images/favicon.ico',
					'li_attr' : { 'class' : 'tree_root' },
					'draggable' : false
				}];
				
			for(var key in data_obj.PAYLOAD)
			{
				displays[0].children.push({
					'id' : key,
					'text' : key,
					'state' : { 'opened' : true, 'selected' : false },
					'children' : [],
					'icon' : 'images/display.ico',
					'li_attr' : { 'class' : 'display_group' },
					'draggable' : false
				});
			}
			$('#displays').jstree(true).settings.core.data = displays;
			$('#displays').jstree(true).refresh();
		}
		else if(data_obj.REQUEST == "CLIENTS")
		{
			displayKeys = {'deviceHeight': 'Height',
						   'deviceWidth': 'Width',
						   'measuredCenter': 'Center',
						   'userAgent': 'User Agent',
						   'ip': 'IP Address',
						   'osName': 'OS',
						   'osVersion': 'Version',
						   'engine': 'Browser Engine',
						   'deviceBrand': 'Device Brand',
						   'deviceModel': 'Device Model',
						   'deviceType': 'Device Type',
						   'width': 'Width',
						   'height': 'Height',
						   'loginScript': 'Login Script',
						   'startScript': 'Start Script',
						   'stopScript': 'Stop Script',
						   'rebootScript': 'Reboot Script',
						   };
						   
			console.log(data_obj.PAYLOAD);
			for(var key in data_obj.PAYLOAD)
			{
				for(var dispKey in $('#displays').jstree(true).settings.core.data[0].children)
				{
					if(data_obj.PAYLOAD[key].displayID == $('#displays').jstree(true).settings.core.data[0].children[dispKey].id)
					{
						children = [];
						
						var icon = "images/client.ico"
						
						for(var dataKey in data_obj.PAYLOAD[key])
						{
							if(dataKey in displayKeys)
							{
								value = data_obj.PAYLOAD[key][dataKey];
								if(dataKey == 'engine')
								{
									value = data_obj.PAYLOAD[key][dataKey].default;
								}
								if(dataKey == 'deviceType' && value != 'desktop')
								{
									icon = "images/mobileclient.ico"
								}
								children.push({
									'id' : dataKey,
									'text' : displayKeys[dataKey] + ": "+ value,
									'state' : { 'opened' : false, 'selected' : false },
									'children' : false,
									'icon' : "images/info.ico",
									'li_attr' : { 'class' : 'display_attr' },
									'draggable' : false
								});
							}
						}
		
						$('#displays').jstree(true).settings.core.data[0].children[dispKey].children.push({
							'id' : key,
							'text' : data_obj.PAYLOAD[key]['friendlyName'] || key,
							'state' : { 'opened' : false, 'selected' : false },
							'children' : children,
							'icon' : icon,
							'li_attr' : { 'class' : 'display' }
						});	
					}
				}
			}
			$('#displays').jstree(true).refresh();
		}
		else if(data_obj.REQUEST == "LIST_PLAYLISTS")
		{
			var $sel = $('#plSelect').empty();
			$('<option>').val("").text("-- select --").appendTo($sel);
			$.each(data_obj.PAYLOAD, function(_, row){
				$('<option>').val(row.name)
					.text(row.name + " (" + row.itemCount + ")").appendTo($sel);
			});
			if (plEditor.name) { $sel.val(plEditor.name); }
		}
		else if(data_obj.REQUEST == "GET_PLAYLIST")
		{
			if (data_obj.PAYLOAD && !data_obj.PAYLOAD.error) {
				plEditor = { name: data_obj.PAYLOAD.name,
					items: data_obj.PAYLOAD.items || [],
					loop: !!data_obj.PAYLOAD.loop, selected: -1 };
				$('#plLoop').prop('checked', plEditor.loop);
				$('#plName').text(plEditor.name);
				plRenderItems(); plRenderInspector();
			}
		}
		else if(data_obj.REQUEST == "ASSIGN_PLAYLIST")
		{
			var s = data_obj.PAYLOAD.status;
			plSetBadge(s === "RENDER_REQUIRED" ? "⚠ needs render"
				: s === "NOT_CALIBRATED" ? "⚠ not calibrated"
				: s === "error" ? "⚠ assign failed" : "✓ assigned");
		}
		else if(data_obj.REQUEST == "RENDER_STATUS")
		{
			var st = data_obj.PAYLOAD.renderStatus || data_obj.PAYLOAD.status;
			plSetBadge(st === "rendering" ? "⏳ rendering…"
				: st === "ready" ? "✓ render ready"
				: st === "error" ? "⚠ render error" : st || "");
		}
	}

	function imageChanged() {
		var file = event.target.files[0];

		if (file.size > 5*1024*1024) {
			alert('Max upload size is 5M');
		}

		// Also see .name, .type

		var image = new Image();
		image.src = URL.createObjectURL(file);
		$('#canvas').empty();
		$('#canvas').prepend(image);
	};
	
	function refreshClients() {
		sock.send(generateMessage('SRV','DISPLAYS','null'));
	    sock.send(generateMessage('SRV','CLIENTS','null'));
	}
	
	$(document).ready(function () {
		$("#calImageForm").submit(function (event) {

			//disable the default form submission
			event.preventDefault();
			//grab all form data  
			var formData = new FormData($('#calImageForm')[0]);

			$.ajax({
				url: 'upload/calibrate',
				type: 'POST',
				data: formData,
				cache: false,
                enctype: 'multipart/form-data',
				contentType: false,
				processData: false,
				success: function (data) {
					image = new Image();
					$('#canvas').hide()
					image.src = data+"?"+GoTime.now();
					$('#canvas').empty();
					$('#canvas').prepend(image);
					image.addEventListener('load', function() {$('#canvas').show();});
				},
				error: function(){
					console.log("Error in ajax form submission");
				}
			});

			return false;
		});
		
		$("#mediaContentForm").submit(function (event) {

			//disable the default form submission
			event.preventDefault();
			//grab all form data  
			var formData = new FormData($('#mediaContentForm')[0]);

			$.ajax({
				url: 'upload/image',
				type: 'POST',
				data: formData,
				cache: false,
                enctype: 'multipart/form-data',
				contentType: false,
				processData: false,
				success: function (data) {
					console.log(data);
				},
				error: function(){
					console.log("Error in ajax form submission");
				}
			});

			return false;
		});
		
		$('#displays').jstree({
		  "core" : {
			"multiple" : false,
			"animation" : 0,
			"themes" : { "stripes" : true },
			"check_callback" :  function (operation, node, node_parent, node_position, more) {
				if (operation === 'move_node'){
					if (Object.hasOwn(node_parent, 'li_attr') && node.li_attr.class == 'display' && node_parent.li_attr.class == 'display_group') {
						return true;
					}
					else{
						return false;
					}
				}
				return true;
			}
		  },
		  "plugins" : [ "contextmenu", "dnd", "search", "state", "unique", "changed" ],
		  'contextmenu' : {
			'items' : customMenu
		  }
		});
		
		function customMenu(node) {
			// The default set of all items
			var items = {
				refreshItem: { // The "refresh" menu item
					label: "Refresh",
					action: function (obj) {
						refreshClients();
					}
				},
				calibrateItem: { // The "calibrate" menu item
					label: "Calibrate Display",
					action: function (obj) {
						sock.send(generateMessage('SRV','GENERATEARUCO',{'id': node.id}));
					}
				},
				identifyItem: { // The "identify" menu item
					label: "Identify Display",
					action: function (obj) {
						sock.send(generateMessage('SRV','IDENTIFYDISPLAY',{'group': node.li_attr.class=='display_group', 'id': node.id}));
					}
				},
			    newItem: { // The "create" menu item
					label: "New Display Group",
					action: function (obj) {
						node = $('#displays').jstree(true).create_node(node);
						$('#displays').jstree(true).edit(node);
					}
				},
				renameItem: { // The "rename" menu item
					label: "Rename",
					action: function (obj) {
						$('#displays').jstree(true).edit(node);
					}
				},
				deleteItem: { // The "delete" menu item
					label: "Delete",
					action: function (obj) {
						$('#displays').jstree(true).delete_node(node);
					}
				}
			};
			
			// Only allow creation of Display groups
			if(node.li_attr.class != 'tree_root') {
				//items.newItem._disabled = true;
				delete items.refreshItem;
				delete items.newItem;
			}
			
			// Only allow identification of displays and display groups
			if(!(node.li_attr.class == 'display' || node.li_attr.class == 'display_group')){
				delete items.identifyItem;
			}
			
			// Only allow rename of devices and device groups except for the default display group
			if(!(node.li_attr.class == 'display' || node.li_attr.class == 'display_group') || node.id == 'Default') {
				//items.renameItem._disabled = true;
				delete items.renameItem;
			}
			// Only show calibrate for display groups
			if (node.li_attr.class != 'display_group'){
				delete items.calibrateItem;
				// Only show the delete item for non default display groups
				delete items.deleteItem;
			}
			else if (node.id == 'Default') {
				
				delete items.deleteItem;
			}

			return items;
		}
		
		/*$('#displays').on("changed.jstree", function (e, data) {
		    console.log('Changed');
			if(data.selected.length) {
				console.log(data);
				console.log('The selected node is: ' + data.selected[0] + " with a value of: " + data.instance.get_node(data.selected[0]).text);
			}
		})*/
		
		$('#displays').on('create_node.jstree',function (e, data) {
		  console.log("create_node");
		  // only allow display groups to be created
		  data.node.icon = 'images/display.ico';
		  data.node.li_attr  = { 'class' : 'display_group' };
		});
		
		$('#displays').on('delete_node.jstree',function (e, data) {
		  console.log("delete_node");
		  sock.send(generateMessage('SRV','UPDATEDISPLAYGROUP',{'oldID':data.node.id, 'newID':null}));
		});

		$('#displays').on('rename_node.jstree',function (e, data) {
		  console.log("rename_node");
		  if(data.node.li_attr.class == 'display_group') {
			  $('#displays').jstree(true).set_id(data.node,data.node.text);
			  sock.send(generateMessage('SRV','UPDATEDISPLAYGROUP',{'oldID':data.old || data.node.id, 'newID':data.text}));
		  }
		  else
		  {
			  sock.send(generateMessage('SRV','UPDATEDISPLAY',{'clientID':data.node.id, 'friendlyName':data.text}));
		  }
		});

		$('#displays').on('move_node.jstree',function (e, data) {
		  console.log("move_node");
		  /* only allow moving device nodes between displays
		  tree_root
		  display_group
		  display
		  display_attr*/
		  if(data.node.li_attr.class == 'display' && $('#'+data.old_parent).first().hasClass('display_group')) {
			sock.send(generateMessage('SRV','UPDATEDISPLAY',{'clientID':data.node.id, 'displayID':data.parent}));
		  }
		})
		
		var to = false;
		$('#displays_q').keyup(function () {
			if(to) { clearTimeout(to); }
			to = setTimeout(function () {
				var v = $('#displays_q').val();
				$('#displays').jstree(true).search(v);
			}, 250);
		});
	});
	
    ProgrammableTimer.setup(1000,tickcallback);
	mosiacMeshConnect(mosiacMeshCallback);
	
  </script>

<body>
<div class="flex-container">

  <div class="flex-child">
    <div id="canvas" style="width: 48em; height: 27em; overflow:auto; border: 1px solid black"></div>
	<form id="calImageForm" action="javascript:;" method="post">
		<label for="calImage">Upload Calibration Image</label>
		<input id="calImage" name="calImage" type="file" value="" onchange='imageChanged(this);'/>

		<input type="submit" value="Upload"/>
	</form>
  </div>
  
  <div class="flex-child">
    <input type="text" id="displays_q" value="" class="input" style="margin:0em auto 1em auto; width: 23em; padding:4px; border-radius:4px; border:1px solid silver;">
    <div id="displays" style="width: 20em; height: 25em; overflow:auto; border: 1px solid black"></div>
  </div>
</div>
<br><br>
<div>
	<div id="Media" style="width: 50em; height: 20em; overflow:auto; border: 1px solid black">
	    <input type="file" name="file" id="file">
            
		<!-- Drag and Drop container-->
		<div class="upload-area"  id="uploadfile">
			<h1>Drag and Drop file here<br/>Or<br/>Click to select file</h1>
		</div>
	</div>
</div>
<br><br>
<div id="playlistEditor" style="border:1px solid black; padding:8px; width:62em; margin-bottom:1em;">
  <div style="margin-bottom:6px;">
    <b>Playlists:</b>
    <select id="plSelect"></select>
    <button id="plNew" type="button">+ New</button>
    <button id="plSave" type="button">Save</button>
    <button id="plDelete" type="button">Delete</button>
    <label style="margin-left:8px;"><input type="checkbox" id="plLoop"> Loop</label>
    <span id="plName" style="margin-left:8px; color:#555;"></span>
  </div>
  <div style="display:flex; gap:10px;">
    <div style="flex:0 0 12em;">
      <div class="size"><b>Media Library</b></div>
      <div id="plLibrary" style="height:14em; overflow:auto; border:1px solid #ccc;"></div>
      <input id="plUpload" type="file" style="margin-top:4px;">
    </div>
    <div style="flex:1;">
      <div class="size"><b>Playlist</b> (drag to reorder)</div>
      <ul id="plItems" style="list-style:none; padding:0; margin:0; height:14em; overflow:auto; border:1px solid #ccc;"></ul>
    </div>
    <div id="plInspectorHost" style="flex:0 0 15em;">
      <!-- Task 8 injects the inspector here -->
    </div>
  </div>
  <div id="plTransport" style="margin-top:6px;">
    <!-- Task 8 injects assign + render + transport here -->
  </div>
</div>
<div id="log" style="width: 50em; height: 20em; overflow:auto; border: 1px solid black">
</div>
<form id="chatform">
  <input id="text" type="text" />
  <input id="calibrate" type="button" value="Submit Query" onclick="sock.send(generateMessage('SRV',$('#text').val(),'null'));"/>
</form>
<script>
var SCRIPT_ANIMATIONS = ["bouncingBalls"];
var plEditor = { name: "", items: [], loop: false, selected: -1 };

function plDefaultItem(file, isScript) {
  return { id: "i" + Date.now() + Math.floor(Math.random()*1000),
           file: file, duration: 5,
           playmode: isScript ? "SCRIPT" : "FULL",
           backgroundColor: "#000000", startEffect: null, endEffect: null };
}

function plRenderLibrary(images, videos) {
  var $lib = $('#plLibrary').empty();
  function row(label, file, isScript) {
    $('<div>').text(label).css({padding:'3px', cursor:'pointer'})
      .on('click', function(){ plAddItem(file, isScript); }).appendTo($lib);
  }
  $.each(images, function(_, f){ row("🖼 " + f.split('/').pop(), f, false); });
  $.each(videos, function(_, f){ row("🎞 " + f.split('/').pop(), f, false); });
  $.each(SCRIPT_ANIMATIONS, function(_, n){ row("⚡ " + n, n, true); });
}

function plLoadLibrary() {
  $.getJSON('/api/media', function(data){
    plRenderLibrary(data.images || [], data.videos || []);
  });
}

function plAddItem(file, isScript) {
  plEditor.items.push(plDefaultItem(file, isScript));
  plRenderItems();
}

function plRenderItems() {
  var $list = $('#plItems').empty();
  $.each(plEditor.items, function(i, it){
    var $li = $('<li>').attr('draggable', true)
      .css({padding:'5px', border:'1px solid #ddd', margin:'2px', cursor:'pointer',
            background: i === plEditor.selected ? '#d6e6fb' : '#fff'})
      .text("⡀ " + (i+1) + "  " + it.file.split('/').pop() + " · " +
            it.duration + "s · " + it.playmode);
    $('<span>').text(" ✕").css({float:'right', color:'#a00'})
      .on('click', function(e){ e.stopPropagation(); plEditor.items.splice(i,1);
            if (plEditor.selected >= plEditor.items.length) plEditor.selected = -1;
            plRenderItems(); plRenderInspector(); }).appendTo($li);
    $li.on('click', function(){ plEditor.selected = i; plRenderItems(); plRenderInspector(); });
    $li.on('dragstart', function(e){ e.originalEvent.dataTransfer.setData('text/plain', i); });
    $li.on('dragover', function(e){ e.preventDefault(); });
    $li.on('drop', function(e){
      e.preventDefault();
      var from = parseInt(e.originalEvent.dataTransfer.getData('text/plain'), 10);
      var moved = plEditor.items.splice(from, 1)[0];
      plEditor.items.splice(i, 0, moved);
      plEditor.selected = i; plRenderItems(); plRenderInspector();
    });
    $list.append($li);
  });
}

function plRenderInspector() {
  var $host = $('#plInspectorHost').empty();
  var it = plEditor.items[plEditor.selected];
  if (!it) { $host.html('<div class="size" style="color:#888;">Select an item</div>'); return; }
  $('<div class="size"><b>Inspector — item ' + (plEditor.selected+1) + '</b></div>').appendTo($host);

  $('<div class="size">Duration (s)</div>').appendTo($host);
  $('<input>').val(it.duration).attr('type','number').css('width','5em')
    .on('change', function(){ it.duration = parseFloat(this.value)||0; plRenderItems(); })
    .appendTo($host);

  $('<div class="size">Play mode</div>').appendTo($host);
  var $pm = $('<select>').appendTo($host);
  $.each([["FULL","FULL"],["SEGMENT","SEGMENT (mesh)"],
          ["INDIVIDUAL","INDIVIDUAL — soon"],["SCRIPT","SCRIPT"]], function(_, o){
    var $o = $('<option>').val(o[0]).text(o[1]);
    if (o[0] === "INDIVIDUAL") $o.prop('disabled', true);
    $pm.append($o);
  });
  $pm.val(it.playmode).on('change', function(){ it.playmode = this.value; plRenderItems(); });

  $('<div class="size">Background color</div>').appendTo($host);
  $('<input>').attr('type','color').val(it.backgroundColor || '#000000')
    .on('change', function(){ it.backgroundColor = this.value; }).appendTo($host);

  $('<div class="size" style="opacity:.5;">Start effect</div>').appendTo($host);
  $('<select disabled><option>None (coming soon)</option></select>').appendTo($host);
  $('<div class="size" style="opacity:.5;">End effect</div>').appendTo($host);
  $('<select disabled><option>None (coming soon)</option></select>').appendTo($host);
}

function plGroupOptions() {
  // Group ids = children of the 'displays' root in the jstree.
  var ids = [];
  try {
    var data = $('#displays').jstree(true).settings.core.data[0].children;
    $.each(data, function(_, g){ ids.push(g.id); });
  } catch (e) {}
  if (!ids.length) ids = ["Default", "Mobile", "Tablet", "Desktop"];
  return ids;
}

function plBuildTransport() {
  var $t = $('#plTransport').empty();
  $('<span>Assign → </span>').appendTo($t);
  var $g = $('<select id="plGroup">').appendTo($t);
  $.each(plGroupOptions(), function(_, id){ $('<option>').val(id).text(id).appendTo($g); });
  $('<button type="button">Assign</button>').on('click', plAssign).appendTo($t);
  $('<button type="button">⚙ Render</button>').on('click', plRender).appendTo($t);
  $('<span id="plRenderBadge" style="margin:0 8px; color:#c80;"></span>').appendTo($t);
  $('<button type="button">▶ Play</button>').on('click', function(){ plTransport('PLAY'); }).appendTo($t);
  $('<button type="button">⏸ Pause</button>').on('click', function(){ plTransport('PAUSE'); }).appendTo($t);
  $('<button type="button">⏹ Stop</button>').on('click', function(){ plTransport('STOP'); }).appendTo($t);
}

function plAssignedGroup() { return $('#plGroup').val(); }

function plAssign() {
  if (!plEditor.name) { alert("Save the playlist first"); return; }
  sock.send(generateMessage('SRV', 'ASSIGN_PLAYLIST',
    { name: plEditor.name, displayID: plAssignedGroup() }));
}
function plRender() {
  sock.send(generateMessage('SRV', 'RENDER', { displayID: plAssignedGroup() }));
}
function plTransport(req) {
  sock.send(generateMessage('SRV', req, { displayID: plAssignedGroup() }));
}
function plSetBadge(text) { $('#plRenderBadge').text(text); }

function plRefreshList() { sock.send(generateMessage('SRV', 'LIST_PLAYLISTS', {})); }

function plLoad(name) {
  if (!name) return;
  sock.send(generateMessage('SRV', 'GET_PLAYLIST', { name: name }));
}

function plNew() {
  plEditor = { name: "", items: [], loop: false, selected: -1 };
  $('#plLoop').prop('checked', false);
  $('#plName').text("(new, unsaved)");
  plRenderItems(); plRenderInspector();
}

function plSave() {
  var name = (plEditor.name || prompt("Playlist name:") || "").trim();
  if (!name) { alert("Name required"); return; }
  plEditor.name = name;
  plEditor.loop = $('#plLoop').is(':checked');
  sock.send(generateMessage('SRV', 'SAVE_PLAYLIST',
    { name: name, items: plEditor.items, loop: plEditor.loop }));
  $('#plName').text(name);
  setTimeout(plRefreshList, 100);
}

function plDelete() {
  if (!plEditor.name) return;
  sock.send(generateMessage('SRV', 'DELETE_PLAYLIST', { name: plEditor.name }));
  plNew(); setTimeout(plRefreshList, 100);
}

function plUploadFile(file) {
  var fd = new FormData(); fd.append('file', file);
  var dest = /\.mp4$/i.test(file.name) ? 'video' : 'image';
  $.ajax({ url: '/upload/' + dest, type: 'POST', data: fd,
           processData: false, contentType: false,
           success: function(){ plLoadLibrary(); } });
}

$(function(){
  $('#plNew').on('click', plNew);
  $('#plSave').on('click', plSave);
  $('#plDelete').on('click', plDelete);
  $('#plSelect').on('change', function(){ plLoad($(this).val()); });
  $('#plUpload').on('change', function(){ if (this.files[0]) plUploadFile(this.files[0]); });
  plLoadLibrary();
  setTimeout(plRefreshList, 500);  // after sock connects
  setTimeout(plBuildTransport, 600);
});
</script>
</body>
</html>
