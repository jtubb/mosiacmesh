  <script src="/js/animations.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.16/jstree.min.js"></script>
  <script>
    // Defer Alpine's auto-start so the ES module below can register the
    // store + components BEFORE Alpine evaluates the existing x-data
    // attributes on the page. Module scripts are deferred and run AFTER
    // classic defer scripts, so without this hook Alpine would already
    // have processed the DOM and missed every Alpine.data/store call.
    // The module retrieves window.__deferredAlpineStart and invokes it
    // once registration is complete.
    // PR-19 (2026-06-09): the original deferLoadingAlpine hook stopped
    // working in Alpine 3.13.10 — Alpine auto-starts on script load
    // without invoking deferLoadingAlpine. We rely instead on the
    // alpine:init event pattern (registered by js/timeline/index.js)
    // AND on script ORDER below: index.js must load + evaluate BEFORE
    // Alpine so its alpine:init listener is registered in time. The
    // deferLoadingAlpine hook is kept as a no-op safety net in case a
    // future Alpine version re-enables it.
    window.deferLoadingAlpine = function (start) { window.__deferredAlpineStart = start; };
  </script>
  <!-- IMPORTANT: index.js MUST come BEFORE the Alpine CDN script. Both are
       deferred; deferred scripts execute in source order, so this puts
       index.js's alpine:init listener in place before Alpine fires the
       event. Reversing the order regresses the bug fixed in PR-19. -->
  <script type="module" src="/js/timeline/index.js"></script>
  <script defer
          src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.10/dist/cdn.min.js"
          integrity="sha384-XBJ5+bq4ga1+0s+J4sl6njqQ9C/YIfKeQw18HypSuGEaPm1g/VWaNdsQ5d3sE1qi"
          crossorigin="anonymous"></script>
  <script>
    // This is the control console, not a display. Opt out of RELOAD broadcasts so
    // reloading a display group (or "all") never reloads the operator's console.
    window._mmNoReload = true;

    // Task 14 (Section 1 overhaul): the dead legacy jQuery was removed here.
    // Deleted: tickcallback + ProgrammableTimer.setup (the admin console does
    // not tick), the raw-SockJS Console <form> submit handler (the Console
    // section markup was removed in Task 12), and the legacy jQuery toast()
    // helper + the bulk of mosiacMeshCallback (the jQuery UIs it drove are
    // gone; the live message path is js/timeline/timeline/sockjs-status.js,
    // which wraps window.sock.onmessage and feeds Alpine.store('mm')).
    //
    // KEPT: the SockJS connection itself. mosiacMeshConnect() (in
    // js/mosiacmesh.js) creates window.sock + wires window.generateMessage,
    // which the timeline modals (play-now / fleet-confirm / calibration /
    // track-header-context-menu) and sockjs-status.js all depend on. The
    // only surviving callback behavior is the operator-facing device
    // join/remove toast, now routed through the Alpine store toast (the
    // legacy jQuery toast() is gone).
    function mosiacMeshCallback(data_obj) {
        var store = (window.Alpine && typeof window.Alpine.store === 'function')
            ? window.Alpine.store('mm') : null;
        if (!store || typeof store.toast !== 'function') { return; }
        if (data_obj.REQUEST == "NEW_DEVICE_CONFIGURED") {
            var nd = data_obj.PAYLOAD || {};
            store.toast('Device joined: ' + (nd.friendlyName || nd.clientKey || 'unknown'), 'info');
        } else if (data_obj.REQUEST == "DEVICE_REMOVED") {
            var rp = data_obj.PAYLOAD || {};
            store.toast(rp.cleared != null ? ('Cleared ' + rp.cleared + ' offline device(s)') : 'Device removed', 'info');
        }
    }

    // Open the SockJS connection so window.sock exists for sockjs-status.js
    // to hook and for the timeline modals to send through.
    mosiacMeshConnect(mosiacMeshCallback);
  </script>

/* ===== MosaicMesh admin design system — design tokens =====
   All CSS custom properties are defined here in one place.
   Theme overrides (light) follow immediately.
   Rules elsewhere in this file reference these tokens; they are
   never redefined outside this block.
   ============================================================ */

/* --- Universal tokens (theme-independent) --- */
:root {
  /* colors — semantic status */
  --ok:#27ae60; --warn:#e6a23c; --danger:#e25555;
  --err:#e25555;         /* alias for danger, used in mm-* components */
  --playing:#4a90d9;

  /* colors — interactive / accent */
  --accent:#4a90d9; --accent-hover:#3a78ba;

  /* spacing scale */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;

  /* radius + shadow */
  --radius:6px;
  --shadow:0 1px 3px rgba(0,0,0,.25);

  /* font */
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

/* --- Dark theme (default) --- */
:root, [data-theme="dark"] {
  /* surfaces */
  --bg:#13171d; --surface:#1a1f27; --surface-2:#222831;
  --bg-elev:#2a2a2a;     /* elevated surface for modals, popovers, context menus */
  --border:#2b313c;

  /* text */
  --text:#e6eaf0; --text-muted:#8b94a2;

  /* PR-23 vertical alignment bars on the day grid — dark theme tones. */
  --grid-hour:rgba(255,255,255,0.22);
  --grid-quarter:rgba(255,255,255,0.07);
}

/* --- Light theme overrides --- */
[data-theme="light"] {
  /* surfaces */
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#eef1f5;
  --bg-elev:#ffffff;     /* elevated surface brightens on light bg */
  --border:#d7dde5;

  /* text */
  --text:#1c2330; --text-muted:#5a6473;

  /* shadow lightens proportionally */
  --shadow:0 1px 3px rgba(0,0,0,.10);

  /* PR-23 alignment bars need to be DARKER strokes on the light bg
     (the dark-theme white-with-low-alpha values disappear against
     a near-white background). Slightly higher alpha on the hour
     tick keeps the visual hierarchy comparable to dark mode. */
  --grid-hour:rgba(28,35,48,0.28);
  --grid-quarter:rgba(28,35,48,0.10);
}

/* --- System light-mode fallback (no explicit data-theme set) --- */
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    /* surfaces */
    --bg:#f4f6f9; --surface:#ffffff; --surface-2:#eef1f5;
    --bg-elev:#ffffff;
    --border:#d7dde5;

    /* text */
    --text:#1c2330; --text-muted:#5a6473;

    /* shadow */
    --shadow:0 1px 3px rgba(0,0,0,.10);

    /* grid lines */
    --grid-hour:rgba(28,35,48,0.28);
    --grid-quarter:rgba(28,35,48,0.10);
  }
}
* { box-sizing:border-box; }
html,body { margin:0; height:100%; }
body { background:var(--bg); color:var(--text); font:14px/1.4 var(--font); }
.app { display:flex; flex-direction:column; height:100vh; }
.statusbar { display:flex; align-items:center; gap:var(--s3); padding:var(--s2) var(--s4); background:var(--surface); border-bottom:1px solid var(--border); }
.statusbar .brand { font-weight:600; }
.statusbar .spacer { margin-left:auto; }
.shell { display:flex; flex:1; min-height:0; }
.sidebar { flex:0 0 168px; background:var(--surface); border-right:1px solid var(--border); padding:var(--s2) 0; overflow:auto; }
.navitem { display:block; width:100%; text-align:left; background:none; border:0; color:var(--text-muted); padding:var(--s2) var(--s4); font:inherit; cursor:pointer; border-left:3px solid transparent; }
.navitem:hover { color:var(--text); }
/* .navitem.active removed — nav uses .navitem.on (Task 12). */
.main { flex:1; overflow:auto; padding:var(--s4); min-width:0; }
/* Task 12: x-show on each .section now owns visibility (it sets inline
   display:none when its activeTab test is false, and clears the inline
   style when true). The old `.section{display:none}` + `.section.active`
   pair fought x-show: a truthy x-show clears the inline style, which then
   fell back to the stylesheet's display:none and the section stayed
   hidden. Dropping the base rules lets a shown <section> render at its
   natural block display. */
.section h2 { margin:0 0 var(--s4); font-size:18px; }
.panel { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:var(--s3); box-shadow:var(--shadow); }
.panel-title { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); margin:0 0 var(--s2); }
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:var(--s3); box-shadow:var(--shadow); }
.toolbar { display:flex; align-items:center; gap:var(--s2); flex-wrap:wrap; }
.btn { font:inherit; border:1px solid var(--border); background:var(--surface-2); color:var(--text); border-radius:var(--radius); padding:6px 12px; cursor:pointer; }
.btn:hover { border-color:var(--accent); }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.btn-primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.btn-primary:hover { background:var(--accent-hover); }
.btn-danger { background:var(--danger); border-color:var(--danger); color:#fff; }
.btn-ghost { background:transparent; }
.field { display:block; margin-bottom:var(--s2); }
.field > label, .field-label { display:block; font-size:12px; color:var(--text-muted); margin-bottom:2px; }
input,select,textarea { font:inherit; background:var(--surface-2); color:var(--text); border:1px solid var(--border); border-radius:var(--radius); padding:6px 8px; }
input:focus,select:focus,textarea:focus,.btn:focus,.navitem:focus { outline:2px solid var(--accent); outline-offset:1px; }
.badge { display:inline-block; font-size:10px; padding:2px 7px; border-radius:10px; border:1px solid var(--border); color:var(--text-muted); }
.badge.online,.badge.ready,.badge.active,.badge.ok { background:color-mix(in srgb,var(--ok) 18%,transparent); border-color:var(--ok); color:var(--ok); }
.badge.playing { background:color-mix(in srgb,var(--playing) 18%,transparent); border-color:var(--playing); color:var(--playing); }
.badge.syncing,.badge.warn { background:color-mix(in srgb,var(--warn) 18%,transparent); border-color:var(--warn); color:var(--warn); }
.badge.offline { background:color-mix(in srgb,var(--danger) 14%,transparent); border-color:var(--danger); color:var(--danger); }
.dot { width:9px; height:9px; border-radius:50%; display:inline-block; background:var(--danger); }
.dot.on { background:var(--ok); }
.row { display:flex; align-items:center; gap:var(--s2); padding:var(--s2); border:1px solid var(--border); border-radius:var(--radius); background:var(--surface-2); margin-bottom:var(--s1); }
.empty { color:var(--text-muted); padding:var(--s4); text-align:center; border:1px dashed var(--border); border-radius:var(--radius); }
.steps { list-style:none; padding:0; margin:0; }
.steps li { display:flex; align-items:center; gap:var(--s2); padding:var(--s1) 0; }
.steps .num { flex:0 0 20px; width:20px; height:20px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; }
.steps .num.done { background:var(--ok); }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:var(--s3); }
.thumbs { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:var(--s2); }
.thumb { border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; background:var(--surface-2); font-size:11px; }
.thumb img,.thumb video { width:100%; height:80px; object-fit:cover; display:block; background:#000; }
.thumb .cap { padding:4px 6px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.toasts { position:fixed; right:var(--s4); bottom:var(--s4); display:flex; flex-direction:column; gap:var(--s2); z-index:50; }
.toast { background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:var(--radius); padding:var(--s2) var(--s3); box-shadow:var(--shadow); max-width:320px; }
.toast.ok { border-left-color:var(--ok); }
.toast.warn { border-left-color:var(--warn); }
.toast.danger { border-left-color:var(--danger); }
.mono { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; }
.jstree-default .jstree-anchor { color:var(--text); }
.jstree-default .jstree-clicked { background:var(--surface-2); box-shadow:none; border-radius:var(--radius); }
.jstree-default .jstree-hovered { background:var(--surface-2); border-radius:var(--radius); }
.jstree-anchor .badge { vertical-align:middle; line-height:1; padding:1px 6px; margin-left:4px; }
/* the jsTree open/close arrow sprite is dark — invert it so it shows on the dark surface */
[data-theme="dark"] .jstree-default .jstree-ocl { filter: invert(1) brightness(1.6); }
/* Task 12: the mobile sidebar layout (bottom nav bar) now lives in the
   four-destination shell block near the end of this stylesheet. The old
   top-horizontal-scroll rules here were removed so they don't fight the
   new bottom bar (they set border-bottom / overflow-x / .navitem.active
   that the new .on-based block doesn't reset). */
/* ===== Mobile-friendly overrides ===== */
@media (max-width: 768px) {
  .main { padding: var(--s2); }
  .statusbar { padding: var(--s1) var(--s2); gap: var(--s2); flex-wrap: wrap; }
  .section h2 { font-size: 16px; margin-bottom: var(--s2); }
  /* Fixed em-widths -> fluid on mobile */
  #log { width: auto !important; max-width: 100%; height: 50vh !important; }
  /* Toolbars: full-width select/input, wrap long button labels */
  .toolbar { gap: var(--s1); }
  .toolbar select, .toolbar input[type="text"], .toolbar input[type="search"] { flex: 1 1 12em; min-width: 8em; }
  /* Touch-friendly buttons (44x44 is the iOS HIG target) */
  .btn { padding: 9px 12px; min-height: 36px; }
  input, select, textarea { padding: 9px 8px; min-height: 36px; }
  /* Form inputs span their container on mobile */
  input[type="text"], input[type="search"], textarea, select { max-width: 100%; }
  /* Toasts wider, kept anchored to bottom */
  .toasts { left: var(--s2); right: var(--s2); bottom: var(--s2); }
  .toast { max-width: 100%; }
  /* Thumbnail grid: smaller cells */
  .thumbs { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
  /* Overview cards: one per row */
  .grid { grid-template-columns: 1fr; }
}
/* Extra-narrow phones: more aggressive compaction */
@media (max-width: 480px) {
  .statusbar { font-size: 12px; }
  .statusbar .brand { font-size: 13px; }
  .navitem { padding: var(--s2) var(--s3); font-size: 13px; }
  /* Some "all"-action buttons in the Overview are noise on mobile */
  .toolbar { flex-wrap: wrap; }
}

/* Cache propagation bar (per display group overview card).
   Spec: docs/superpowers/specs/2026-06-03-cache-progress-and-
   propagation-ui.md. Two overlaid fills: the solid green band is
   the count of iPads with the full segment set cached; the
   lighter green band on top of it shows in-flight push progress
   contribution. Stalled iPads color the count chip red. */
.cache-propagation { margin: 6px 0 2px; font-size: 12px; }
.cache-propagation-label { display: flex; justify-content: space-between;
    color: var(--text-muted); margin-bottom: 2px; }
.cache-propagation-bar { position: relative; width: 100%; height: 6px;
    background: var(--border); border-radius: 3px; overflow: hidden; }
.cache-propagation-fill { position: absolute; top: 0; left: 0; height: 100%;
    background: #2e7d32; transition: width 250ms ease-out; }
.cache-propagation-fill-inflight { background: #81c784; opacity: 0.55; }
.cache-propagation.stalled .cache-propagation-counts { color: #d32f2f;
    font-weight: 600; }
/* ===== Timeline Day-view grid ===== */
.mm-day-grid, .mm-week-grid { position: relative; }
.mm-now-line {
  position: absolute; top: 0; bottom: 0; width: 2px;
  background: var(--err, red); pointer-events: none;
  left: 0; z-index: 5;
}
/* PR-25: snapped-start indicator during a drag. Pinned to the
   target track row by clip-move.js / playlist-to-track.js on
   dragover; hidden on dragend / drop. Position fixed (viewport-
   relative) so the drag handlers can place it directly from
   ev.clientX without worrying about scroll offsets. */
.mm-drag-start-marker {
  position: fixed;
  pointer-events: none;
  z-index: 1500;
  width: 2px;
  background: var(--warn, #fc6);
  box-shadow: 0 0 4px rgba(252, 198, 102, 0.6);
}
.mm-drag-start-marker-label {
  position: absolute;
  top: -20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--warn, #fc6);
  color: #000;
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
/* PR-23 (2026-06-09): vertical alignment bars across the day grid.
   Bold solid line on the hour (every 1/24 of the usable area, starting
   110px in past the track-label column), fainter solid line on every
   15-minute mark. The hour gradient is listed first so it composites
   ON TOP of the quarter-hour layer at shared positions (every 24th of
   the 96 lines), keeping the hour mark visually dominant.
   "Dashed" was the original ask; CSS-only dashed vertical lines need
   either an SVG background-image or 72 individual elements — the
   color-weighted solids give the same visual hierarchy at a fraction
   of the complexity. If real dashed is desired, swap the second
   gradient for a data-URI SVG with stroke-dasharray. */
.mm-day-grid {
  font-size: 12px;
  background-image:
    repeating-linear-gradient(to right,
      var(--grid-hour) 0,
      var(--grid-hour) 1px,
      transparent 1px,
      transparent calc((100% - 110px) / 24)
    ),
    repeating-linear-gradient(to right,
      var(--grid-quarter) 0,
      var(--grid-quarter) 1px,
      transparent 1px,
      transparent calc((100% - 110px) / 96)
    );
  background-position: 110px 0;
  background-size: calc(100% - 110px) 100%, calc(100% - 110px) 100%;
  background-repeat: no-repeat, no-repeat;
}
.mm-week-grid { font-size: 12px; }
.mm-week-cell { background: rgba(255,255,255,0.02); min-height: 18px; }
.mm-month-grid { font-size: 12px; }
.mm-month-cell { background: rgba(255,255,255,0.02); min-height: 60px; padding: 4px; position: relative; }
.mm-month-cell-blank { background: transparent; }
.mm-month-num { font-weight: 600; }
.mm-month-dots { margin-top: 4px; }
.mm-month-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:3px; }
.mm-axis-cell { color: var(--text-muted); padding: 2px 4px; }
.mm-track-row .mm-track-header { padding: 4px; }
.mm-track-name { font-weight: 600; }
.mm-track-status { color: var(--text-muted); font-size: 11px; }
.mm-status-dot { display:inline-block; width:8px; height:8px; border-radius:50%; vertical-align:middle; margin-right:4px; }
.mm-render-badge { color: var(--warn); font-size: 10px; margin-left: 6px; }
/* PR-4b: drop target overlay for drag-playlist→create-schedule. Sits in
   the same grid cell as any clips on that track row; clips are emitted
   AFTER the droparea so they paint on top. During an in-flight playlist
   drag, body.mm-dragging-playlist disables pointer-events on clips so the
   dragover/drop targets the droparea, not the clip on top of it. */
.mm-track-droparea { background: rgba(255,255,255,0.02); border-radius: 4px; min-height: 28px; }
.mm-track-droparea.mm-drag-target { background: rgba(80,160,255,0.18); outline: 2px dashed rgba(80,160,255,0.6); outline-offset: -2px; }
/* PR-4b: while any of our drag handlers is mid-drag, clips become
   transparent to pointer events so the .mm-track-droparea underneath
   receives dragover/drop. The dragging element is still grabbed by the
   browser (its own pointer-events state doesn't matter once drag began),
   so this only affects OTHER clips that the cursor crosses. */
/* PR-21 (2026-06-09): the `pointer-events: none` rule we used to put on
   clips during drag silently cancelled Chromium's OS-level drag when
   applied to the source element (no dragover, no drop, drag dies in
   <5px). The reason we had it — letting dragover pass through clips to
   reach the underlying .mm-track-droparea — is now handled in JS via
   `document.elementsFromPoint` in clip-move.js and playlist-to-track.js
   (see findDroparea). Just the opacity ghost is kept for visual feedback. */
body.mm-dragging .mm-clip { opacity: 0.85; }
.mm-clip[draggable="true"] { cursor: grab; }
.mm-clip[draggable="true"]:active { cursor: grabbing; }
.mm-bin-item[draggable="true"] { cursor: grab; }
.mm-bin-item[draggable="true"]:active { cursor: grabbing; }
.mm-clip { background: var(--accent, #345); color: white; border-radius: 4px; padding: 4px 6px; position: relative; overflow: hidden; user-select: none; outline: 1px solid transparent; transition: outline 60ms; }
.mm-clip-selected { outline: 2px solid var(--warn, #fc6); outline-offset: 1px; }
/* PR-4b: 6px invisible edge handles for pointer-event resize. Hover
   shows a subtle highlight; cursor: ew-resize. draggable=false on the
   element keeps an edge-grab from kicking off the clip-move handler. */
/* PR-11: handle widened 6 → 10px. 6px was too narrow on narrow clips
   (the default 1-hour drop is ~50px wide at 1200px viewport) and users
   routinely missed it, kicking off a clip-move drag instead of a
   resize. The matching EDGE_HIT_PX guard in drag/clip-move.js catches
   any near-edge dragstart that still slips past. */
.mm-clip-resize-handle { position: absolute; top: 0; bottom: 0; width: 10px; cursor: ew-resize; background: transparent; z-index: 2; }
.mm-clip-resize-handle[data-edge="left"]  { left: 0; }
.mm-clip-resize-handle[data-edge="right"] { right: 0; }
.mm-clip-resize-handle:hover { background: rgba(255,255,255,0.15); }
/* PR-4b: drill-in sub-row. Sits below the main day grid, spans the
   full width, hosts a left-to-right ribbon of playlist items. Each
   item is absolute-positioned with left+width % so dragging media in
   (PR4b T11) lands on the row regardless of which item is under the
   cursor. */
.mm-drillin-row { background: rgba(120, 170, 240, 0.08); border-left: 3px solid var(--accent, #6ad); border-radius: 4px; padding: 6px 8px; margin-top: 4px; }
.mm-drillin-header { display: flex; align-items: baseline; gap: 8px; font-size: 11px; margin-bottom: 4px; }
.mm-drillin-label { font-weight: 600; }
.mm-drillin-hint { color: var(--text-muted, #888); font-size: 10px; }
.mm-drillin-items { position: relative; height: 28px; background: rgba(0,0,0,0.18); border-radius: 3px; }
.mm-drillin-item { position: absolute; top: 2px; bottom: 2px; background: var(--bg-elev, #333); border-radius: 3px; padding: 0 6px; font-size: 11px; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.08); cursor: pointer; transition: outline 60ms; }
/* PR-4c gap-fix (spec §358): selected sub-item highlight. Del removes it. */
.mm-drillin-item.mm-drillin-item-selected { outline: 2px solid var(--warn, #fc6); outline-offset: 1px; background: rgba(255, 204, 102, 0.18); }
/* PR-8: drop-target highlight during sub-item drag-to-reorder. */
.mm-drillin-item.mm-drillin-drop-target { outline: 2px dashed var(--accent, #6ad); outline-offset: 1px; background: rgba(120, 170, 240, 0.22); }
.mm-drillin-row.mm-drag-target { background: rgba(120, 170, 240, 0.2); outline: 2px dashed rgba(120, 170, 240, 0.6); outline-offset: -2px; }
.mm-drillin-empty { color: var(--text-muted, #888); font-size: 11px; padding: 4px 6px; }
.mm-clip-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mm-clip-time { font-size: 10px; opacity: 0.8; }
.mm-clip-stripe {
  position: absolute; top:0; bottom:0;
  background: repeating-linear-gradient(45deg, rgba(255,0,0,0.2) 0 6px, transparent 6px 12px);
  pointer-events: none;
}
/* PR-4c gap-fix (spec §367): Week-view variant — vertical orientation
   so the stripe extends along the clip's height rather than its width.
   Overrides top/bottom (default fills vertically) with top/height %
   set by the renderer; left:0 right:0 makes it span the clip's width. */
.mm-clip-stripe-vertical { top: auto; bottom: auto; left: 0; right: 0; }
.mm-toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 0; flex-wrap: wrap; }
.mm-toolbar-date { font-weight: 600; min-width: 220px; text-align: center; }
.btn-active { background: var(--accent, #345); color: white; }
.mm-toast-stack { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 6px; z-index: 1000; max-width: 360px; }
/* PR-4b T13: recurrence popover. Floats anchored under a clip; click
   outside dismisses (handler in recurrence-popover.js). */
.mm-popover { position: fixed; z-index: 1100; background: var(--bg-elev, #2a2a2a); padding: 12px; border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,0.6); min-width: 320px; color: var(--text, #eee); }
.mm-popover-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
.mm-popover-row label { font-size:12px; display:flex; align-items:center; gap:4px; }
.mm-toast { padding: 8px 12px; border-radius: 6px; background: var(--bg-elev, #2a2a2a); color: var(--text, #eee); cursor: pointer; box-shadow: 0 2px 12px rgba(0,0,0,0.5); font-size: 12px; }
.mm-toast-error { background: var(--err, #c33); }
.mm-toast-info  { background: var(--accent, #345); }
/* PR-4c: modal scaffold (modal-shell.js) */
.mm-modal-overlay { position: fixed; inset: 0; z-index: 1500; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; }
.mm-modal { background: var(--bg-elev, #2a2a2a); color: var(--text, #eee); border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.7); min-width: 360px; max-width: 90vw; max-height: 90vh; display: flex; flex-direction: column; }
.mm-modal-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.mm-modal-header h2 { font-size: 14px; margin: 0; }
.mm-modal-body { padding: 12px; overflow: auto; }
.mm-modal-close { padding: 2px 8px; min-width: auto; }
/* Task-11: modal → bottom sheet on mobile */
@media (max-width: 760px) {
  .mm-modal-overlay { align-items: flex-end; }      /* dock to bottom */
  .mm-modal {
    width: 100%;
    max-width: 100%;
    max-height: 92vh;
    border-radius: 14px 14px 0 0;                    /* sheet: rounded top only */
    animation: mm-sheet-up 180ms ease-out;
  }
  .mm-modal-body { overflow-y: auto; }
}
@keyframes mm-sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
/* PR-4c T-A4: recurrence editor form + preview */
.mm-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin-bottom: 12px; }
.mm-form-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; }
.mm-form-grid label input, .mm-form-grid label select { font-size: 12px; padding: 4px; box-sizing: border-box; width: 100%; }
/* Radios + checkboxes shouldn't stretch — the width:100% rule above is
   for text/number/date inputs. Without this override the radios in
   .mm-form-row (e.g. "Never / Until / After N times") render enormous
   because they're inside .mm-form-grid labels. */
.mm-form-grid input[type="radio"],
.mm-form-grid input[type="checkbox"] { width: auto; }
.mm-form-row { grid-column: 1 / -1; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 12px; }
.mm-form-row label { flex-direction: row; gap: 4px; }
.mm-form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 12px; }
.mm-btn-danger { background: var(--err); color: #fff; border-color: var(--err); }
.mm-btn-danger:hover { filter: brightness(1.08); }
/* Vertical-list playlist editor (.mm-ple*). Replaces the PR-17 ribbon.
   Items render top-to-bottom; click a row to edit it in the settings
   box; "+ Add content" opens an inline picker (media + animations). */
.mm-ple-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.mm-ple-list { list-style:none; padding:0; margin:0 0 12px; max-height:40vh; overflow-y:auto; }
.mm-ple-row { display:flex; align-items:center; gap:8px; padding:8px; background:var(--surface-2); border:1px solid var(--border); border-radius:6px; margin-bottom:6px; cursor:pointer; }
.mm-ple-row.sel { border-color:var(--accent); }
.mm-ple-grip { cursor:grab; color:var(--text-muted); }
.mm-ple-ic { width:18px; text-align:center; }
.mm-ple-nm { flex:1; font-size:13px; }
.mm-ple-dur { font-size:11px; color:var(--text-muted); }
.mm-ple-del { border:none; background:none; color:var(--text-muted); cursor:pointer; font-size:15px; }
.mm-ple-settings { display:flex; gap:12px; flex-wrap:wrap; padding:10px; background:var(--surface); border:1px solid var(--border); border-radius:6px; margin-bottom:10px; }
.mm-ple-settings label { font-size:12px; display:flex; flex-direction:column; gap:3px; }
.mm-ple-hint { font-size: 10px; color: var(--text-muted); }
.mm-ple-add { width:100%; border:1px dashed var(--accent); color:var(--accent); background:none; border-radius:6px; padding:9px; }
.mm-ple-picker { border:1px solid var(--border); border-radius:6px; padding:10px; margin-top:8px; }
.mm-ple-picker-filters { display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
.mm-ple-picker-filters button { font-size:11px; padding:2px 9px; border-radius:999px; border:1px solid var(--border); background:none; color:var(--text-muted); cursor:pointer; }
.mm-ple-picker-filters button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
.mm-ple-picker-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:8px; max-height:240px; overflow-y:auto; }
.mm-ple-picktile { display:flex; flex-direction:column; gap:4px; align-items:center; font-size:10px; padding:8px 4px; border:1px solid var(--border); border-radius:6px; background:var(--surface-2); color:var(--text); cursor:pointer; }
.mm-ple-picktile.kind-animation { border-color:#9a7bff; }
.mm-ple-picktile span:first-child { font-size:18px; }
.mm-recurrence-preview { border-top: 1px solid rgba(255,255,255,0.08); padding-top: 10px; font-size: 11px; }
.mm-recurrence-preview ol { margin: 6px 0 0 18px; padding: 0; }
.mm-recurrence-preview li { padding: 2px 0; }
.mm-recurrence-empty { color: var(--text-muted, #888); list-style: none; margin-left: -18px; }
/* PR-4c T-D1: calibration modal */
.mm-calibration .steps { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.mm-calibration .steps li { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.mm-calibration .steps .num { width: 22px; height: 22px; border-radius: 50%; background: var(--accent, #345); display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 11px; flex-shrink: 0; }
.mm-calibration-status, .mm-calibration-result { font-size: 11px; color: var(--text-muted, #888); }
.mm-calibration-result { margin: 10px 0; padding: 8px; background: rgba(0,0,0,0.2); border-radius: 4px; }
.mm-context-menu { position: fixed; z-index: 1600; background: var(--bg-elev, #2a2a2a); color: var(--text, #eee); border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; padding: 4px 0; min-width: 160px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); list-style: none; margin: 0; }
.mm-context-menu li { padding: 6px 12px; cursor: pointer; font-size: 12px; }
.mm-context-menu li:hover { background: rgba(255,255,255,0.08); }
.mm-context-menu li.mm-context-divider { padding: 0; border-top: 1px solid rgba(255,255,255,0.08); margin: 2px 0; pointer-events: none; }
.mm-context-menu li.mm-context-danger { color: var(--err, #f88); }
.mm-track-header { cursor: pointer; }
.mm-timeline-layout { display: flex; gap: 12px; }
.mm-bin { width: 200px; flex: 0 0 200px; }
.mm-bin-section { margin-bottom: 16px; }
.mm-bin-title { font-weight: 600; margin-bottom: 6px; }
.mm-bin-list { list-style: none; padding: 0; margin: 0; max-height: 240px; overflow-y: auto; }
.mm-bin-item { padding: 4px 6px; cursor: default; }
.mm-bin-item:hover { background: rgba(255,255,255,0.05); }
/* PR-16: media bin gains a delete × button on hover. Visible-on-hover keeps the row uncluttered. */
.mm-bin-item-deletable { display: flex; align-items: center; gap: 6px; }
.mm-bin-delete { opacity: 0; background: transparent; border: 0; color: var(--text-muted, #888); font-size: 16px; line-height: 1; padding: 0 4px; cursor: pointer; }
.mm-bin-item-deletable:hover .mm-bin-delete { opacity: 1; }
.mm-bin-delete:hover { color: var(--err, #f88); }
.mm-timeline-main { flex: 1 1 auto; min-width: 0; }
/* PR-4c T-C3: profile-editor 3-pane shell */
.mm-profile-editor { display: grid; grid-template-columns: 200px 1fr 280px; gap: 10px; min-width: 900px; max-width: 1100px; min-height: 480px; }
.mm-pe-list { border-right: 1px solid rgba(255,255,255,0.08); padding-right: 8px; display: flex; flex-direction: column; gap: 6px; }
.mm-pe-list-actions { display: flex; gap: 4px; }
.mm-pe-profiles { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; font-size: 12px; }
.mm-pe-profiles li { padding: 6px 8px; cursor: pointer; border-radius: 3px; }
.mm-pe-profiles li:hover { background: rgba(255,255,255,0.06); }
.mm-pe-profiles li.selected { background: rgba(120,170,240,0.18); }
.mm-pe-form { overflow-y: auto; padding-right: 8px; min-width: 0; }
.mm-pe-empty { color: var(--text-muted, #888); padding: 12px; font-size: 12px; }
.mm-pe-preview { border-left: 1px solid rgba(255,255,255,0.08); padding-left: 8px; display: flex; flex-direction: column; gap: 6px; }
.mm-pe-preview-header { display: flex; flex-direction: column; gap: 4px; font-size: 11px; }
.mm-pe-preview-body { flex: 1; background: rgba(0,0,0,0.3); padding: 8px; font-size: 11px; white-space: pre-wrap; word-break: break-all; overflow-y: auto; min-height: 200px; }
.mm-pe-danger { color: var(--err, #f88); }
.mm-pe-unresolved { color: var(--err, #f88); font-weight: bold; }
/* PR-4c gap-fix (spec §363): fleet-action confirm modal body */
.mm-fleet-confirm { min-width: 320px; max-width: 460px; }
.mm-fleet-confirm-desc { color: var(--text-muted, #888); font-size: 12px; margin: 0 0 10px; }
.mm-fleet-confirm-summary { font-size: 13px; margin: 0 0 14px; }
.mm-fleet-confirm-summary strong { color: var(--warn, #fc6); }
.mm-fleet-confirm-danger { background: var(--err, #c33) !important; }
/* PR-29: ad-hoc Play-Now picker modal */
.mm-play-now { min-width: 280px; max-width: 380px; }
.mm-play-now-note { color: var(--text-muted, #888); font-size: 12px; margin: 0 0 12px; }
.mm-play-now-empty { color: var(--text-muted, #888); font-size: 12px; margin: 0 0 14px; font-style: italic; }
.mm-play-now-list { list-style: none; padding: 0; margin: 0 0 12px; display: flex; flex-direction: column; gap: 4px; max-height: 320px; overflow-y: auto; }
.mm-play-now-list li { margin: 0; }
.mm-play-now-pick { width: 100%; text-align: left; }
/* PR-4c T-C4: profile-editor form pane */
.mm-pe-script-row { display: grid; grid-template-columns: 50px 1fr; gap: 6px; align-items: center; margin-bottom: 4px; font-size: 11px; }
.mm-pe-script-row textarea { font-family: monospace; font-size: 11px; padding: 4px; box-sizing: border-box; width: 100%; }
.mm-profile-editor details { margin-bottom: 8px; }
.mm-profile-editor summary { cursor: pointer; font-size: 12px; font-weight: 600; padding: 4px 0; }
.mm-form-row-wide { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 4px; }
/* ===== Task 12: four-destination shell + Now landing ===== */
.navitem .ni-ic { font-size: 16px; margin-right: 8px; }
.navitem.on { color: var(--text); background: var(--surface-2); border-left: 2px solid var(--accent); }
.now-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.now-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; padding: 12px; }
.now-card.playing { border-color: var(--accent); }
.nc-head { display: flex; justify-content: space-between; align-items: center; }
.nc-name { font-weight: 600; }
.nc-pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--surface); color: var(--text-muted); }
.nc-pill.playing { background: rgba(74,144,217,.18); color: var(--accent); }
.nc-meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--text-muted); margin-top: 6px; }
.now-glance { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
.now-empty { color: var(--text-muted); padding: 24px; text-align: center; }
.placeholder-tab { color: var(--text-muted); padding: 40px; text-align: center; }

@media (max-width: 760px) {
  .shell { display: block; }
  .sidebar {
    position: fixed; left: 0; right: 0; bottom: 0; top: auto;
    display: flex; flex-direction: row; border-top: 1px solid var(--border);
    background: var(--surface); z-index: 1200;
  }
  .sidebar .navitem { display: flex; align-items: center; justify-content: center; flex: 1; flex-direction: column; gap: 2px; font-size: 10px; text-align: center; border-left: none; }
  .sidebar .navitem.on { border-left: none; border-top: 2px solid var(--accent); background: transparent; }
  .navitem .ni-ic { margin-right: 0; display: block; font-size: 18px; }
  .main { padding-bottom: 64px; }
}

.mm-content-subtabs { display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:12px; }
.mm-content-subtabs button { background:none; border:none; color:var(--text-muted); padding:8px 14px; border-bottom:2px solid transparent; cursor:pointer; }
.mm-content-subtabs button.on { color:var(--text); font-weight:600; border-bottom-color:var(--accent); }
.mm-content-toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
.mm-content-filters { display:flex; gap:6px; flex-wrap:wrap; }
.mm-content-filters button { font-size:12px; padding:3px 10px; border-radius:999px; border:1px solid var(--border); background:none; color:var(--text-muted); cursor:pointer; }
.mm-content-filters button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
.mm-content-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; }
.mm-content-tile { position:relative; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:14px 8px; text-align:center; }
.mm-content-tile.kind-animation { border-color:#9a7bff; }
.mm-tile-ic { display:block; font-size:22px; margin-bottom:6px; }
.mm-tile-name { font-size:11px; word-break:break-all; }
.mm-tile-del { position:absolute; top:4px; right:4px; border:none; background:rgba(0,0,0,.4); color:#fff; border-radius:50%; width:18px; height:18px; line-height:16px; cursor:pointer; opacity:0; }
.mm-content-tile:hover .mm-tile-del { opacity:1; }
.mm-content-empty { color:var(--text-muted); padding:24px; text-align:center; }
.mm-playlist-list { list-style:none; padding:0; margin:0; }
.mm-playlist-row { display:flex; align-items:center; gap:10px; padding:8px; border:1px solid var(--border); border-radius:6px; margin-bottom:6px; }
.mm-playlist-name { flex:1; text-align:left; background:none; border:none; color:var(--text); font-size:14px; cursor:pointer; }
.mm-playlist-meta { font-size:11px; color:var(--text-muted); }
.mm-playlist-del { border:none; background:none; color:var(--text-muted); cursor:pointer; font-size:16px; }

/* ---- Section 3: mobile Schedule stack ---- */
.mm-schedule-mobile { padding-bottom:88px; }
.mm-sched-mobile-toolbar { display:flex; align-items:center; gap:6px; padding:8px 0; flex-wrap:wrap; }
.mm-density-toggle { display:inline-flex; gap:2px; }
.mm-sched-group { max-width:46vw; }
.mm-sched-mobile-datenav { display:flex; align-items:center; gap:8px; padding:4px 0 10px; }
.mm-sched-mobile-datenav .mm-toolbar-date { flex:1; text-align:center; font-weight:600; }
.mm-sched-fab { position:fixed; right:16px; bottom:76px; z-index:50; border-radius:22px; padding:10px 18px; box-shadow:0 3px 10px rgba(0,0,0,.35); font-weight:600; }

/* Agenda (Day + day-sectioned Week) */
.mm-agenda { display:flex; flex-direction:column; gap:14px; }
.mm-agenda-group { border:1px solid var(--border); border-radius:8px; background:var(--bg-elev); overflow:hidden; }
.mm-agenda-group-title { margin:0; padding:8px 12px; font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--text-muted); background:rgba(127,127,127,.08); border-bottom:1px solid var(--border); }
.mm-agenda-day-header { margin:16px 0 6px; padding:6px 4px; font-size:13px; font-weight:700; color:var(--text); border-bottom:2px solid var(--accent); position:sticky; top:0; background:var(--bg); z-index:1; }
.mm-agenda-empty { padding:10px 12px; color:var(--text-muted); font-size:12px; font-style:italic; }
.mm-agenda-row { padding:9px 12px; border-bottom:1px solid var(--border); cursor:pointer; }
.mm-agenda-group .mm-agenda-row:last-child { border-bottom:none; }
.mm-agenda-row:active { background:rgba(127,127,127,.10); }
.mm-agenda-row.mm-agenda-now { background:color-mix(in srgb, var(--warn) 14%, transparent); }
.mm-agenda-main { display:flex; align-items:center; gap:7px; flex-wrap:wrap; font-size:14px; }
.mm-agenda-ic { opacity:.8; }
.mm-agenda-time { font-variant-numeric:tabular-nums; color:var(--text-muted); font-size:13px; }
.mm-agenda-name { font-weight:600; }
.mm-agenda-live { font-size:10px; font-weight:700; color:#fff; background:var(--warn); border-radius:8px; padding:1px 6px; }
.mm-agenda-conflict { font-size:10px; font-weight:700; color:#fff; background:var(--err); border-radius:8px; padding:1px 6px; }
.mm-agenda-recur { font-size:11px; color:var(--text-muted); }
.mm-agenda-spark { display:flex; gap:1px; height:5px; margin-top:6px; border-radius:3px; overflow:hidden; }
.mm-agenda-seg { display:block; height:100%; }

/* Vertical day timeline */
.mm-vt { border:1px solid var(--border); border-radius:8px; background:var(--bg-elev); margin-top:4px; }
.mm-vt-hour { border-top:1px solid var(--border); box-sizing:border-box; left:0; right:0; }
.mm-vt-hour:first-child { border-top:none; }
.mm-vt-label { position:absolute; left:4px; top:1px; font-size:10px; color:var(--text-muted); font-variant-numeric:tabular-nums; }
.mm-vt-block { background:var(--accent); color:#fff; border-radius:5px; padding:3px 6px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.3); cursor:pointer; box-sizing:border-box; }
.mm-vt-block-now { outline:2px solid var(--warn); }
.mm-vt-block-name { display:block; font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mm-vt-block-time { display:block; font-size:10px; opacity:.85; }
.mm-vt-nowline { height:2px; background:var(--err); z-index:3; }

/* ---- Section 4: Fleet ---- */
.mm-fleet { display:flex; gap:14px; align-items:flex-start; }
.mm-fleet-list { flex:0 0 38%; max-width:380px; }
.mm-fleet-list-head { display:flex; align-items:center; gap:6px; padding:4px 0 8px; }
.mm-fleet-list-title { font-weight:700; }
.mm-fleet-groups { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; }
.mm-fleet-group { display:flex; align-items:center; gap:8px; padding:9px 10px; border:1px solid var(--border); border-radius:8px; background:var(--bg-elev); cursor:pointer; }
.mm-fleet-group.sel { outline:2px solid var(--accent); }
.mm-fleet-group-name { flex:1; font-weight:600; }
.mm-fleet-group-badges { display:flex; align-items:center; gap:6px; font-size:12px; }
.mm-fleet-online { color:var(--text-muted); font-variant-numeric:tabular-nums; }
.mm-fleet-badge.playing { color:var(--ok); }
.mm-fleet-badge.calibrated { color:var(--ok); }
.mm-fleet-empty { color:var(--text-muted); font-style:italic; padding:10px; }
.mm-fleet-detail { flex:1; min-width:0; }
.mm-fleet-detail-head { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.mm-fleet-detail-name { margin:0; font-size:18px; }
.mm-fleet-statusline { color:var(--text-muted); font-size:13px; margin-bottom:12px; }
.mm-fleet-cards { display:flex; flex-direction:column; gap:12px; }
.mm-fleet-card { border:1px solid var(--border); border-radius:8px; background:var(--bg-elev); padding:10px 12px; }
.mm-fleet-card-title { margin:0 0 8px; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); }
.mm-fleet-card-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.mm-fleet-calib { color:var(--text-muted); font-size:13px; }
.mm-fleet-selall { display:inline-flex; align-items:center; gap:6px; font-size:13px; margin-bottom:8px; }
.mm-fleet-devices { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; }
.mm-fleet-device { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:6px 4px; border-bottom:1px solid var(--border); font-size:13px; }
.mm-fleet-dev-dot { width:8px; height:8px; border-radius:50%; background:#888; flex:0 0 auto; }
.mm-fleet-dev-dot.online { background:var(--ok); }
.mm-fleet-dev-name { font-weight:600; }
.mm-fleet-dev-type { color:var(--text-muted); }
.mm-fleet-dev-field { display:inline-flex; align-items:center; gap:4px; font-size:12px; color:var(--text-muted); }
.mm-fleet-bulkbar { display:flex; align-items:center; gap:8px; margin-top:8px; padding-top:8px; border-top:1px solid var(--border); }
/* Mobile: list is full-width; detail becomes a full-screen sheet. */
@media (max-width:759px){
  .mm-fleet { flex-direction:column; }
  .mm-fleet-list { flex:1 1 auto; max-width:none; }
  .mm-fleet-detail.mm-fleet-sheet { position:fixed; inset:0; z-index:60; background:var(--bg); overflow:auto; padding:14px; }
}
  </style>
</head>
<body>
<!-- Task 12: Alpine 3 only walks elements inside an x-data root. The
     statusbar (connection indicator) and sidebar (nav) live outside the
     per-section x-data scopes, so the whole shell is wrapped in a single
     empty x-data root here. $store.mm is global and resolves from any
     nested scope; the per-section x-data="{}" roots still work as nested
     scopes. Without this, the nav :class/@click and the connText x-text
     never evaluate. -->
<div class="app" x-data="{}">
  <div class="statusbar">
    <span class="brand">● MosaicMesh</span>
    <span class="dot" id="connDot" :class="{ on: $store.mm.connection.connected }"></span>
    <span id="connText" class="size" x-text="$store.mm.connection.connected ? ('connected · ' + $store.mm.connection.onlineClients + ' online') : 'connecting…'"></span>
    <span class="spacer"></span>
    <button class="btn btn-ghost" id="themeToggle" type="button">🌙 Theme</button>
  </div>
  <div class="shell">
    <nav class="sidebar" id="sidebar" role="navigation" aria-label="Sections">
      <button class="navitem" :class="{ on: $store.mm.activeTab==='now' }"
              :aria-current="$store.mm.activeTab==='now' ? 'page' : false"
              @click="$store.mm.goTo('now')"><span class="ni-ic">⚡</span><span class="ni-lbl">Now</span></button>
      <button class="navitem" :class="{ on: $store.mm.activeTab==='content' }"
              :aria-current="$store.mm.activeTab==='content' ? 'page' : false"
              @click="$store.mm.goTo('content')"><span class="ni-ic">▦</span><span class="ni-lbl">Content</span></button>
      <button class="navitem" :class="{ on: $store.mm.activeTab==='schedule' }"
              :aria-current="$store.mm.activeTab==='schedule' ? 'page' : false"
              @click="$store.mm.goTo('schedule')"><span class="ni-ic">📅</span><span class="ni-lbl">Schedule</span></button>
      <button class="navitem" :class="{ on: $store.mm.activeTab==='fleet' }"
              :aria-current="$store.mm.activeTab==='fleet' ? 'page' : false"
              @click="$store.mm.goTo('fleet')"><span class="ni-ic">📡</span><span class="ni-lbl">Fleet</span></button>
    </nav>
    <main class="main">
      <section class="section" data-route="now" x-data="{}" x-show="$store.mm.activeTab==='now'">
        <div class="now-glance" x-text="`${$store.mm.connection.onlineClients} online · ${$store.mm.nowCards.filter(c=>c.state==='playing').length} playing`"></div>
        <div class="now-cards">
          <template x-for="card in $store.mm.nowCards" :key="card.displayID">
            <div class="now-card" :class="{ playing: card.state==='playing' }">
              <div class="nc-head">
                <span class="nc-name" x-text="card.displayID"></span>
                <span class="nc-pill" :class="card.state" x-text="card.state==='playing' ? '▶ playing' : card.state"></span>
              </div>
              <div class="nc-meta">
                <span x-text="card.currentPlaylist || 'Idle'"></span>
                <span x-text="`${card.onlineCount}/${card.screenCount} online`"></span>
                <span class="nc-render" x-show="card.renderStatus==='rendering'">· rendering…</span>
              </div>
            </div>
          </template>
          <p class="now-empty" x-show="$store.mm.nowCards.length===0">No display groups yet.</p>
        </div>
      </section>
      <section class="section" data-route="content" x-show="$store.mm.activeTab==='content'" x-data="mmContent">
        <div class="mm-content-subtabs">
          <button :class="{on: subview==='library'}" @click="subview='library'">Library</button>
          <button :class="{on: subview==='playlists'}" @click="subview='playlists'">Playlists</button>
        </div>

        <!-- Library -->
        <div x-show="subview==='library'">
          <div class="mm-content-toolbar">
            <div class="mm-content-filters">
              <button :class="{on: filter==='all'}" @click="filter='all'">All</button>
              <button :class="{on: filter==='image'}" @click="filter='image'">Images</button>
              <button :class="{on: filter==='video'}" @click="filter='video'">Videos</button>
              <button :class="{on: filter==='animation'}" @click="filter='animation'">Animations</button>
            </div>
            <label class="btn btn-primary mm-upload-label">+ Upload
              <input type="file" accept="image/*,video/*" multiple style="display:none" @change="uploadFiles($event)">
            </label>
          </div>
          <div class="mm-content-grid">
            <template x-for="it in items" :key="it.kind + ':' + it.ref">
              <div class="mm-content-tile" :class="'kind-' + it.kind">
                <span class="mm-tile-ic" x-text="iconFor(it.kind)"></span>
                <span class="mm-tile-name" x-text="it.name"></span>
                <button class="mm-tile-del" x-show="it.kind!=='animation'" @click="removeItem(it)" title="Delete">×</button>
              </div>
            </template>
            <p class="mm-content-empty" x-show="items.length===0">Nothing here yet.</p>
          </div>
        </div>

        <!-- Playlists -->
        <div x-show="subview==='playlists'">
          <div class="mm-content-toolbar">
            <button class="btn btn-primary" @click="newPlaylist()">+ New playlist</button>
          </div>
          <ul class="mm-playlist-list">
            <template x-for="p in playlists" :key="p.name">
              <li class="mm-playlist-row">
                <button class="mm-playlist-name" @click="edit(p.name)" x-text="p.name"></button>
                <span class="mm-playlist-meta" x-text="(p.items?.length || 0) + ' items'"></span>
                <button class="mm-playlist-del" @click="deletePlaylist(p.name)" title="Delete">×</button>
              </li>
            </template>
            <p class="mm-content-empty" x-show="playlists.length===0">No playlists yet.</p>
          </ul>
        </div>
      </section>
      <section class="section" data-route="schedule" x-data="{}" x-show="$store.mm.activeTab==='schedule'">
        <div x-show="!$store.mm.hydrated && !$store.mm.hydrateError" style="color:var(--text-muted)">Loading…</div>
        <div x-show="$store.mm.hydrateError" style="color:var(--err)" x-text="'Failed to load: ' + $store.mm.hydrateError"></div>

        <div x-show="$store.mm.hydrated && !$store.mm.isMobile" class="mm-timeline-layout">
          <aside class="mm-bin">
            <div x-data="mmPlaylistBin" class="mm-bin-section">
              <div class="mm-bin-title">Playlists</div>
              <ul class="mm-bin-list">
                <template x-for="p in list" :key="p.name">
                  <li class="mm-bin-item"
                      draggable="true"
                      @dragstart="dragStart(p.name, $event)"
                      @dragend="dragEnd()"
                      x-text="p.name"></li>
                </template>
              </ul>
            </div>
          </aside>
          <div class="mm-timeline-main">
            <div x-data="mmToolbar" class="mm-toolbar">
              <button class="btn" :class="{'btn-active': $store.mm.viewMode==='day'}"   @click="setMode('day')">Day</button>
              <button class="btn" :class="{'btn-active': $store.mm.viewMode==='week'}"  @click="setMode('week')">Week</button>
              <button class="btn" :class="{'btn-active': $store.mm.viewMode==='month'}" @click="setMode('month')">Month</button>
              <button class="btn btn-ghost" @click="step(-1)">◀</button>
              <span class="mm-toolbar-date" x-text="formatDate()"></span>
              <button class="btn btn-ghost" @click="step(1)">▶</button>
              <button class="btn btn-ghost" @click="today()">Today</button>
              <button class="btn btn-primary" @click="openCreateSchedule()" title="Schedule a playlist on a group">+ Schedule</button>

              <template x-if="$store.mm.viewMode !== 'day'">
                <select class="input" :value="$store.mm.selectedDisplay"
                        @change="setSelectedDisplay($event.target.value)">
                  <template x-for="id in availableDisplayIds" :key="id">
                    <option :value="id" x-text="id"></option>
                  </template>
                </select>
              </template>

            </div>
            <div x-data="mmTimeline" x-html="render()"></div>
          </div>
        </div>

        <!-- Mobile: agenda / vertical / week / month stack (Section 3) -->
        <div x-show="$store.mm.hydrated && $store.mm.isMobile" x-data="mmScheduleMobile" class="mm-schedule-mobile">
          <div class="mm-sched-mobile-toolbar">
            <button class="btn" :class="{'btn-active': $store.mm.viewMode==='day'}"   @click="$store.mm.setViewMode('day')">Day</button>
            <button class="btn" :class="{'btn-active': $store.mm.viewMode==='week'}"  @click="$store.mm.setViewMode('week')">Week</button>
            <button class="btn" :class="{'btn-active': $store.mm.viewMode==='month'}" @click="$store.mm.setViewMode('month')">Month</button>
            <span style="flex:1"></span>
            <template x-if="$store.mm.viewMode==='day'">
              <span class="mm-density-toggle">
                <button class="btn btn-ghost" :class="{'btn-active': density==='agenda'}"   @click="setDensity('agenda')" title="Agenda list">☰</button>
                <button class="btn btn-ghost" :class="{'btn-active': density==='vertical'}" @click="setDensity('vertical')" title="Day timeline">▤</button>
              </span>
            </template>
            <template x-if="$store.mm.viewMode==='month' || ($store.mm.viewMode==='day' && density==='vertical')">
              <select class="input mm-sched-group" @change="setSelGroup($event.target.value)" title="Display group">
                <template x-for="id in tracks" :key="id"><option :value="id" :selected="id === selGroupResolved" x-text="id"></option></template>
              </select>
            </template>
          </div>
          <div class="mm-sched-mobile-datenav" x-data="mmToolbar">
            <button class="btn btn-ghost" @click="step(-1)">◀</button>
            <span class="mm-toolbar-date" x-text="formatDate()"></span>
            <button class="btn btn-ghost" @click="step(1)">▶</button>
            <button class="btn btn-ghost" @click="today()">Today</button>
          </div>
          <div x-html="render()"></div>
          <button class="btn btn-primary mm-sched-fab" @click="openCreate()" title="Schedule a playlist">+ Schedule</button>
        </div>

      </section>
      <!-- PR-6: legacy sections (overview / displays / media / playlists /
           schedules) deleted. Their functionality lives in the (now
           Schedule-tab) timeline section + its modals + the toolbar
           buttons. Task 12 (Section 1 overhaul): the old raw-SockJS
           Console section was removed and the shell became the four
           destinations Now / Content / Schedule / Fleet. The timeline
           markup was relocated under data-route="schedule" (above) so
           mmTimeline/mmToolbar/mmPlaylistBin still mount. -->

      <section class="section" data-route="fleet" x-show="$store.mm.activeTab==='fleet'" x-data="mmFleet">
        <div x-show="!$store.mm.hydrated && !$store.mm.hydrateError" style="color:var(--text-muted)">Loading…</div>
        <div x-show="$store.mm.hydrateError" style="color:var(--err)" x-text="'Failed to load: ' + $store.mm.hydrateError"></div>
        <div x-show="$store.mm.hydrated" class="mm-fleet">
          <aside class="mm-fleet-list" x-show="!$store.mm.isMobile || selectedGroupId===null">
            <div class="mm-fleet-list-head">
              <span class="mm-fleet-list-title">Groups</span>
              <span style="flex:1"></span>
              <button class="btn btn-ghost" @click="openProfiles()" title="Edit device profiles">⚙ Profiles</button>
              <button class="btn btn-primary" @click="newGroup()">+ New group</button>
            </div>
            <ul class="mm-fleet-groups">
              <template x-for="g in groups" :key="g.displayID">
                <li class="mm-fleet-group" :class="{'sel': g.displayID===selectedGroupId}" @click="selectGroup(g.displayID)">
                  <span class="mm-fleet-group-name" x-text="g.displayID"></span>
                  <span class="mm-fleet-group-badges">
                    <span class="mm-fleet-online" x-text="statusFor(g).online + '/' + statusFor(g).total"></span>
                    <template x-if="statusFor(g).playing"><span class="mm-fleet-badge playing" title="Playing">▶</span></template>
                    <template x-if="statusFor(g).rendering"><span class="mm-fleet-badge rendering" title="Rendering">⟳</span></template>
                    <template x-if="calibrationFor(g).total>0 && calibrationFor(g).calibratedCount===calibrationFor(g).total"><span class="mm-fleet-badge calibrated" title="Calibrated">✓</span></template>
                  </span>
                </li>
              </template>
              <template x-if="groups.length===0">
                <li class="mm-fleet-empty">No display groups yet. Create one with "+ New group".</li>
              </template>
            </ul>
          </aside>
          <section class="mm-fleet-detail" x-show="selectedGroup" :class="{'mm-fleet-sheet': $store.mm.isMobile}">
            <template x-if="selectedGroup">
              <div>
                <div class="mm-fleet-detail-head">
                  <button class="btn btn-ghost mm-fleet-back" x-show="$store.mm.isMobile" @click="backToList()">‹ Fleet</button>
                  <h2 class="mm-fleet-detail-name" x-text="selectedGroup.displayID"></h2>
                  <span style="flex:1"></span>
                  <button class="btn mm-btn-danger" @click="deleteGroup()">Delete group</button>
                </div>
                <div class="mm-fleet-statusline">
                  <span x-text="statusFor(selectedGroup).online + '/' + statusFor(selectedGroup).total + ' online'"></span>
                  <template x-if="statusFor(selectedGroup).playing"><span> · ▶ <span x-text="statusFor(selectedGroup).playlistName || 'playing'"></span></span></template>
                  <template x-if="!statusFor(selectedGroup).playing"><span> · idle</span></template>
                </div>
                <div class="mm-fleet-cards">
                  <div class="mm-fleet-card">
                    <h3 class="mm-fleet-card-title">Playback</h3>
                    <div class="mm-fleet-card-actions">
                      <button class="btn btn-primary" @click="playNow()">▶ Play now</button>
                      <button class="btn" @click="stopNow()">⏹ Stop</button>
                      <button class="btn" @click="renderNow()" title="Pre-bake mosaic segments for this group">⟳ Render now</button>
                      <button class="btn" @click="reloadGroup()" title="Reload the display page on every device in this group">↻ Reload</button>
                    </div>
                  </div>
                  <div class="mm-fleet-card">
                    <h3 class="mm-fleet-card-title">Calibration</h3>
                    <div class="mm-fleet-card-actions">
                      <span class="mm-fleet-calib" x-text="calibrationFor(selectedGroup).calibratedCount + '/' + calibrationFor(selectedGroup).total + ' calibrated'"></span>
                      <button class="btn" @click="calibrate()">🎯 Calibrate…</button>
                    </div>
                  </div>
                  <div class="mm-fleet-card">
                    <h3 class="mm-fleet-card-title">Device scripts</h3>
                    <div class="mm-fleet-card-actions">
                      <button class="btn" @click="runScript('login')">Login</button>
                      <button class="btn" @click="runScript('start')">Start</button>
                      <button class="btn" @click="runScript('stop')">Stop</button>
                      <button class="btn" @click="runScript('reboot')">Reboot</button>
                      <button class="btn" @click="runScript('test')">Test</button>
                    </div>
                  </div>
                  <div class="mm-fleet-card">
                    <h3 class="mm-fleet-card-title">Devices (<span x-text="devices.length"></span>)</h3>
                    <label class="mm-fleet-selall"><input type="checkbox" :checked="allSelected" @change="toggleBulkAll()"> Select all</label>
                    <ul class="mm-fleet-devices">
                      <template x-for="d in devices" :key="d.clientKey">
                        <li class="mm-fleet-device">
                          <input type="checkbox" :checked="bulkSelection.has(d.clientKey)" @change="toggleBulk(d.clientKey)">
                          <span class="mm-fleet-dev-dot" :class="{online: d.isOnline}" :title="d.isOnline ? 'online' : 'offline'"></span>
                          <span class="mm-fleet-dev-name" x-text="d.friendlyName || d.clientKey"></span>
                          <span class="mm-fleet-dev-type" x-text="d.deviceType || ''"></span>
                          <label class="mm-fleet-dev-field">Profile
                            <select @change="setDeviceProfile(d.clientKey, $event.target.value)">
                              <option value="" :selected="!d.profileName">Auto-match</option>
                              <template x-for="p in profileNames" :key="p"><option :value="p" :selected="d.profileName===p" x-text="p"></option></template>
                            </select>
                          </label>
                          <label class="mm-fleet-dev-field">Group
                            <select @change="moveDevice(d.clientKey, $event.target.value)">
                              <template x-for="g in groups" :key="g.displayID"><option :value="g.displayID" :selected="g.displayID===selectedGroupId" x-text="g.displayID"></option></template>
                            </select>
                          </label>
                        </li>
                      </template>
                      <template x-if="devices.length===0">
                        <li class="mm-fleet-empty">No devices in this group.</li>
                      </template>
                    </ul>
                    <div class="mm-fleet-bulkbar" x-show="bulkSelection.size>0">
                      <span x-text="bulkSelection.size + ' selected'"></span>
                      <select x-model="bulkTarget">
                        <option value="">Move selected to…</option>
                        <template x-for="g in groups" :key="g.displayID">
                          <template x-if="g.displayID!==selectedGroupId"><option :value="g.displayID" x-text="g.displayID"></option></template>
                        </template>
                      </select>
                      <button class="btn btn-primary" :disabled="!bulkTarget" @click="bulkMove(bulkTarget)">Apply</button>
                    </div>
                  </div>
                </div>
              </div>
            </template>
          </section>
        </div>
      </section>
    </main>
  </div>
  <!-- Global overlay layer: lives at the .app top level, NOT inside a route
       <section> (whose x-show toggles display:none — which hid any modal
       mounted into #mmModalHost when its section wasn't the active tab).
       modal-shell.js / context-menu.js + the drag marker append/position
       into these. -->
  <div x-data="mmToast" class="mm-toast-stack" x-show="items.length > 0">
    <template x-for="t in items" :key="t.id">
      <div class="mm-toast" :class="'mm-toast-' + t.kind" @click="dismiss(t.id)" x-text="t.msg"></div>
    </template>
  </div>
  <div id="mmModalHost"></div>
  <ul id="mmContextMenu" class="mm-context-menu" style="display:none"></ul>
  <div id="mmDragStartMarker" class="mm-drag-start-marker" style="display:none">
    <div class="mm-drag-start-marker-label">00:00</div>
  </div>
</div>
<div class="toasts" id="toasts"></div>
<script>
// Task 12 (Section 1 overhaul): the old jQuery adminRoute() + .navitem click
// handlers + hashchange listener were removed. Section visibility is now
// driven by Alpine x-show on each .section, reflecting $store.mm.activeTab,
// which js/timeline/shell/router.js keeps in sync with location.hash.
function adminApplyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  $('#themeToggle').text(t === 'light' ? '☀ Light' : '🌙 Dark');
}
$(function(){
  var stored = null;
  try { stored = localStorage.getItem('adminTheme'); } catch(e) {}
  if (!stored) { stored = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark'; }
  adminApplyTheme(stored);
  $('#themeToggle').on('click', function(){
    var t = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    adminApplyTheme(t);
    try { localStorage.setItem('adminTheme', t); } catch(e) {}
  });
});
</script>
</body>
</html>
