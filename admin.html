<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#13171d">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.16/themes/default/style.min.css" />
  <script src="/js/jquery.min.js"></script>
  <script src="/js/sockjs.min.js"></script>
  <script src="/js/GoTime.js"></script> 
  <script src="/js/mosiacmesh.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.16/jstree.min.js"></script>
  <script>
    // Defer Alpine's auto-start so the ES module below can register the
    // store + components BEFORE Alpine evaluates the existing x-data
    // attributes on the page. Module scripts are deferred and run AFTER
    // classic defer scripts, so without this hook Alpine would already
    // have processed the DOM and missed every Alpine.data/store call.
    // The module retrieves window.__deferredAlpineStart and invokes it
    // once registration is complete.
    // PR-19 (2026-06-09): the original deferLoadingAlpine hook stopped
    // working in Alpine 3.13.10 — Alpine auto-starts on script load
    // without invoking deferLoadingAlpine. We rely instead on the
    // alpine:init event pattern (registered by js/timeline/index.js)
    // AND on script ORDER below: index.js must load + evaluate BEFORE
    // Alpine so its alpine:init listener is registered in time. The
    // deferLoadingAlpine hook is kept as a no-op safety net in case a
    // future Alpine version re-enables it.
    window.deferLoadingAlpine = function (start) { window.__deferredAlpineStart = start; };
  </script>
  <!-- IMPORTANT: index.js MUST come BEFORE the Alpine CDN script. Both are
       deferred; deferred scripts execute in source order, so this puts
       index.js's alpine:init listener in place before Alpine fires the
       event. Reversing the order regresses the bug fixed in PR-19. -->
  <script type="module" src="/js/timeline/index.js"></script>
  <script defer
          src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.10/dist/cdn.min.js"
          integrity="sha384-XBJ5+bq4ga1+0s+J4sl6njqQ9C/YIfKeQw18HypSuGEaPm1g/VWaNdsQ5d3sE1qi"
          crossorigin="anonymous"></script>
  <script>
    // This is the control console, not a display. Opt out of RELOAD broadcasts so
    // reloading a display group (or "all") never reloads the operator's console.
    window._mmNoReload = true;
    function tickcallback(currentTime,currentTarget,drift_correction)
    {
        if(sock == null)
        {
            mosiacMeshConnect();
        }
    }
	
	$('form').submit(function() {
		var text = generateMessage("SRV",$('#text').val(),"");
        log('Sending: ' + text);
        sock.send(text);
        $('#text').val('').focus();
        return false;
    });
	
	function mosiacMeshCallback(data_obj)
	{
		// PR-6: this legacy dispatcher used to update jQuery UIs that
		// have all been deleted (the Displays tree, the playlists and
		// schedules editors, the propagation bars). The new admin
		// hydrates from REST + chains its own SockJS subscriber via
		// js/timeline/timeline/sockjs-status.js, which handles
		// DISCOVERY_HEARTBEAT / CLIENTS_WENT_OFFLINE / RENDER_IN_PROGRESS
		// independently of this function.
		//
		// What survives here:
		//   - connection-status text (the only legacy UI element still
		//     visible: the green dot + 'connected · N online' line);
		//   - operator-facing toasts for device-join / device-remove
		//     (the new admin's live data pulls reflect the same events,
		//     but the toast surfaces what changed).
		$('#connDot').addClass('on');
		$('#connText').text('connected');
		if (data_obj.REQUEST == "DISCOVERY_HEARTBEAT")
		{
			var p = data_obj.PAYLOAD || {};
			$('#connText').text('connected' + (p.onlineClients != null ? ' · ' + p.onlineClients + ' online' : ''));
		}
		else if (data_obj.REQUEST == "NEW_DEVICE_CONFIGURED")
		{
			var nd = data_obj.PAYLOAD || {};
			if (typeof toast === 'function') toast('Device joined: ' + (nd.friendlyName || nd.clientKey || 'unknown'), 'ok');
		}
		else if (data_obj.REQUEST == "DEVICE_REMOVED")
		{
			var rp = data_obj.PAYLOAD || {};
			if (typeof toast === 'function') {
				toast(rp.cleared != null ? ('Cleared ' + rp.cleared + ' offline device(s)') : 'Device removed', 'ok');
			}
		}
	}

	function toast(msg, kind) {
	  var $t = $('<div class="toast">').addClass(kind || '').text(msg).appendTo('#toasts');
	  setTimeout(function(){ $t.fadeOut(250, function(){ $(this).remove(); }); }, 3000);
	}


    ProgrammableTimer.setup(1000,tickcallback);
	mosiacMeshConnect(mosiacMeshCallback);


  </script>
  <style>
	img{
		max-width: 100%;
		max-height: 100%;
	}
	
    .flex-container {
		display: flex;
		overflow:hidden
	}

	.flex-child {
		flex: 1;
		overflow:hidden
	}  

	.flex-child:first-child {
		margin-right: 10px;
		overflow:hidden
	} 
	.upload-area{
		width: 100%;
		min-height: 160px;
		display: flex;
		align-items: center;
		justify-content: center;
		border: 2px dashed var(--border);
		border-radius: var(--radius);
		background: var(--surface);
		margin: 0;
		text-align: center;
		cursor: pointer;
	}

	.upload-area:hover, .upload-area.dragover{
		border-color: var(--accent);
		background: var(--surface-2);
	}

	.upload-area h1{
		text-align: center;
		font-weight: normal;
		font-size: 16px;
		line-height: 1.5;
		color: var(--text-muted);
		margin: 0;
	}

	#file{
		display: none;
	}

	/* Thumbnail */
	.thumbnail{
		width: 80px;
		height: 80px;
		padding: 2px;
		border: 2px solid lightgray;
		border-radius: 3px;
		float: left;
	}

	.size{
		font-size:12px;
	}

/* ===== MosaicMesh admin design system ===== */
:root {
  --accent:#4a90d9; --accent-hover:#3a78ba;
  --ok:#27ae60; --warn:#e6a23c; --danger:#e25555; --playing:#4a90d9;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --radius:6px; --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --shadow:0 1px 3px rgba(0,0,0,.25);
}
:root, [data-theme="dark"] {
  --bg:#13171d; --surface:#1a1f27; --surface-2:#222831; --border:#2b313c;
  --text:#e6eaf0; --text-muted:#8b94a2;
}
[data-theme="light"] {
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#eef1f5; --border:#d7dde5;
  --text:#1c2330; --text-muted:#5a6473; --shadow:0 1px 3px rgba(0,0,0,.10);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    --bg:#f4f6f9; --surface:#ffffff; --surface-2:#eef1f5; --border:#d7dde5;
    --text:#1c2330; --text-muted:#5a6473;
  }
}
* { box-sizing:border-box; }
html,body { margin:0; height:100%; }
body { background:var(--bg); color:var(--text); font:14px/1.4 var(--font); }
.app { display:flex; flex-direction:column; height:100vh; }
.statusbar { display:flex; align-items:center; gap:var(--s3); padding:var(--s2) var(--s4); background:var(--surface); border-bottom:1px solid var(--border); }
.statusbar .brand { font-weight:600; }
.statusbar .spacer { margin-left:auto; }
.shell { display:flex; flex:1; min-height:0; }
.sidebar { flex:0 0 168px; background:var(--surface); border-right:1px solid var(--border); padding:var(--s2) 0; overflow:auto; }
.navitem { display:block; width:100%; text-align:left; background:none; border:0; color:var(--text-muted); padding:var(--s2) var(--s4); font:inherit; cursor:pointer; border-left:3px solid transparent; }
.navitem:hover { color:var(--text); }
.navitem.active { color:var(--text); background:var(--surface-2); border-left-color:var(--accent); }
.main { flex:1; overflow:auto; padding:var(--s4); min-width:0; }
.section { display:none; }
.section.active { display:block; }
.section h2 { margin:0 0 var(--s4); font-size:18px; }
.panel { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:var(--s3); box-shadow:var(--shadow); }
.panel-title { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); margin:0 0 var(--s2); }
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:var(--s3); box-shadow:var(--shadow); }
.toolbar { display:flex; align-items:center; gap:var(--s2); flex-wrap:wrap; }
.btn { font:inherit; border:1px solid var(--border); background:var(--surface-2); color:var(--text); border-radius:var(--radius); padding:6px 12px; cursor:pointer; }
.btn:hover { border-color:var(--accent); }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.btn-primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.btn-primary:hover { background:var(--accent-hover); }
.btn-danger { background:var(--danger); border-color:var(--danger); color:#fff; }
.btn-ghost { background:transparent; }
.field { display:block; margin-bottom:var(--s2); }
.field > label, .field-label { display:block; font-size:12px; color:var(--text-muted); margin-bottom:2px; }
input,select,textarea { font:inherit; background:var(--surface-2); color:var(--text); border:1px solid var(--border); border-radius:var(--radius); padding:6px 8px; }
input:focus,select:focus,textarea:focus,.btn:focus,.navitem:focus { outline:2px solid var(--accent); outline-offset:1px; }
.badge { display:inline-block; font-size:10px; padding:2px 7px; border-radius:10px; border:1px solid var(--border); color:var(--text-muted); }
.badge.online,.badge.ready,.badge.active,.badge.ok { background:color-mix(in srgb,var(--ok) 18%,transparent); border-color:var(--ok); color:var(--ok); }
.badge.playing { background:color-mix(in srgb,var(--playing) 18%,transparent); border-color:var(--playing); color:var(--playing); }
.badge.syncing,.badge.warn { background:color-mix(in srgb,var(--warn) 18%,transparent); border-color:var(--warn); color:var(--warn); }
.badge.offline { background:color-mix(in srgb,var(--danger) 14%,transparent); border-color:var(--danger); color:var(--danger); }
.dot { width:9px; height:9px; border-radius:50%; display:inline-block; background:var(--danger); }
.dot.on { background:var(--ok); }
.row { display:flex; align-items:center; gap:var(--s2); padding:var(--s2); border:1px solid var(--border); border-radius:var(--radius); background:var(--surface-2); margin-bottom:var(--s1); }
.empty { color:var(--text-muted); padding:var(--s4); text-align:center; border:1px dashed var(--border); border-radius:var(--radius); }
.steps { list-style:none; padding:0; margin:0; }
.steps li { display:flex; align-items:center; gap:var(--s2); padding:var(--s1) 0; }
.steps .num { flex:0 0 20px; width:20px; height:20px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; }
.steps .num.done { background:var(--ok); }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:var(--s3); }
.thumbs { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:var(--s2); }
.thumb { border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; background:var(--surface-2); font-size:11px; }
.thumb img,.thumb video { width:100%; height:80px; object-fit:cover; display:block; background:#000; }
.thumb .cap { padding:4px 6px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.toasts { position:fixed; right:var(--s4); bottom:var(--s4); display:flex; flex-direction:column; gap:var(--s2); z-index:50; }
.toast { background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:var(--radius); padding:var(--s2) var(--s3); box-shadow:var(--shadow); max-width:320px; }
.toast.ok { border-left-color:var(--ok); }
.toast.warn { border-left-color:var(--warn); }
.toast.danger { border-left-color:var(--danger); }
.mono { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; }
.jstree-default .jstree-anchor { color:var(--text); }
.jstree-default .jstree-clicked { background:var(--surface-2); box-shadow:none; border-radius:var(--radius); }
.jstree-default .jstree-hovered { background:var(--surface-2); border-radius:var(--radius); }
.jstree-anchor .badge { vertical-align:middle; line-height:1; padding:1px 6px; margin-left:4px; }
/* the jsTree open/close arrow sprite is dark — invert it so it shows on the dark surface */
[data-theme="dark"] .jstree-default .jstree-ocl { filter: invert(1) brightness(1.6); }
@media (max-width:760px) {
  .shell { flex-direction:column; }
  .sidebar { flex:none; display:flex; overflow-x:auto; border-right:0; border-bottom:1px solid var(--border); }
  .navitem { border-left:0; border-bottom:3px solid transparent; white-space:nowrap; }
  .navitem.active { border-left:0; border-bottom-color:var(--accent); }
}
/* ===== Mobile-friendly overrides ===== */
@media (max-width: 768px) {
  .main { padding: var(--s2); }
  .statusbar { padding: var(--s1) var(--s2); gap: var(--s2); flex-wrap: wrap; }
  .section h2 { font-size: 16px; margin-bottom: var(--s2); }
  /* Fixed em-widths -> fluid on mobile */
  #log { width: auto !important; max-width: 100%; height: 50vh !important; }
  /* Toolbars: full-width select/input, wrap long button labels */
  .toolbar { gap: var(--s1); }
  .toolbar select, .toolbar input[type="text"], .toolbar input[type="search"] { flex: 1 1 12em; min-width: 8em; }
  /* Touch-friendly buttons (44x44 is the iOS HIG target) */
  .btn { padding: 9px 12px; min-height: 36px; }
  input, select, textarea { padding: 9px 8px; min-height: 36px; }
  /* Form inputs span their container on mobile */
  input[type="text"], input[type="search"], textarea, select { max-width: 100%; }
  /* Toasts wider, kept anchored to bottom */
  .toasts { left: var(--s2); right: var(--s2); bottom: var(--s2); }
  .toast { max-width: 100%; }
  /* Thumbnail grid: smaller cells */
  .thumbs { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
  /* Overview cards: one per row */
  .grid { grid-template-columns: 1fr; }
}
/* Extra-narrow phones: more aggressive compaction */
@media (max-width: 480px) {
  .statusbar { font-size: 12px; }
  .statusbar .brand { font-size: 13px; }
  .navitem { padding: var(--s2) var(--s3); font-size: 13px; }
  /* Some "all"-action buttons in the Overview are noise on mobile */
  .toolbar { flex-wrap: wrap; }
}

/* Cache propagation bar (per display group overview card).
   Spec: docs/superpowers/specs/2026-06-03-cache-progress-and-
   propagation-ui.md. Two overlaid fills: the solid green band is
   the count of iPads with the full segment set cached; the
   lighter green band on top of it shows in-flight push progress
   contribution. Stalled iPads color the count chip red. */
.cache-propagation { margin: 6px 0 2px; font-size: 12px; }
.cache-propagation-label { display: flex; justify-content: space-between;
    color: var(--text-muted); margin-bottom: 2px; }
.cache-propagation-bar { position: relative; width: 100%; height: 6px;
    background: var(--border); border-radius: 3px; overflow: hidden; }
.cache-propagation-fill { position: absolute; top: 0; left: 0; height: 100%;
    background: #2e7d32; transition: width 250ms ease-out; }
.cache-propagation-fill-inflight { background: #81c784; opacity: 0.55; }
.cache-propagation.stalled .cache-propagation-counts { color: #d32f2f;
    font-weight: 600; }
/* ===== Timeline Day-view grid ===== */
.mm-day-grid, .mm-week-grid { position: relative; }
.mm-now-line {
  position: absolute; top: 0; bottom: 0; width: 2px;
  background: var(--err, red); pointer-events: none;
  left: 0; z-index: 5;
}
.mm-day-grid { font-size: 12px; }
.mm-week-grid { font-size: 12px; }
.mm-week-cell { background: rgba(255,255,255,0.02); min-height: 18px; }
.mm-month-grid { font-size: 12px; }
.mm-month-cell { background: rgba(255,255,255,0.02); min-height: 60px; padding: 4px; position: relative; }
.mm-month-cell-blank { background: transparent; }
.mm-month-num { font-weight: 600; }
.mm-month-dots { margin-top: 4px; }
.mm-month-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:3px; }
.mm-axis-cell { color: var(--text-muted); padding: 2px 4px; }
.mm-track-row .mm-track-header { padding: 4px; }
.mm-track-name { font-weight: 600; }
.mm-track-status { color: var(--text-muted); font-size: 11px; }
.mm-status-dot { display:inline-block; width:8px; height:8px; border-radius:50%; vertical-align:middle; margin-right:4px; }
.mm-render-badge { color: var(--warn); font-size: 10px; margin-left: 6px; }
/* PR-4b: drop target overlay for drag-playlist→create-schedule. Sits in
   the same grid cell as any clips on that track row; clips are emitted
   AFTER the droparea so they paint on top. During an in-flight playlist
   drag, body.mm-dragging-playlist disables pointer-events on clips so the
   dragover/drop targets the droparea, not the clip on top of it. */
.mm-track-droparea { background: rgba(255,255,255,0.02); border-radius: 4px; min-height: 28px; }
.mm-track-droparea.mm-drag-target { background: rgba(80,160,255,0.18); outline: 2px dashed rgba(80,160,255,0.6); outline-offset: -2px; }
/* PR-4b: while any of our drag handlers is mid-drag, clips become
   transparent to pointer events so the .mm-track-droparea underneath
   receives dragover/drop. The dragging element is still grabbed by the
   browser (its own pointer-events state doesn't matter once drag began),
   so this only affects OTHER clips that the cursor crosses. */
body.mm-dragging .mm-clip,
body.mm-dragging-playlist .mm-clip { pointer-events: none; }
body.mm-dragging .mm-clip { opacity: 0.85; }
.mm-clip[draggable="true"] { cursor: grab; }
.mm-clip[draggable="true"]:active { cursor: grabbing; }
.mm-bin-item[draggable="true"] { cursor: grab; }
.mm-bin-item[draggable="true"]:active { cursor: grabbing; }
.mm-clip { background: var(--accent, #345); color: white; border-radius: 4px; padding: 4px 6px; position: relative; overflow: hidden; user-select: none; outline: 1px solid transparent; transition: outline 60ms; }
.mm-clip-selected { outline: 2px solid var(--warn, #fc6); outline-offset: 1px; }
/* PR-4b: 6px invisible edge handles for pointer-event resize. Hover
   shows a subtle highlight; cursor: ew-resize. draggable=false on the
   element keeps an edge-grab from kicking off the clip-move handler. */
/* PR-11: handle widened 6 → 10px. 6px was too narrow on narrow clips
   (the default 1-hour drop is ~50px wide at 1200px viewport) and users
   routinely missed it, kicking off a clip-move drag instead of a
   resize. The matching EDGE_HIT_PX guard in drag/clip-move.js catches
   any near-edge dragstart that still slips past. */
.mm-clip-resize-handle { position: absolute; top: 0; bottom: 0; width: 10px; cursor: ew-resize; background: transparent; z-index: 2; }
.mm-clip-resize-handle[data-edge="left"]  { left: 0; }
.mm-clip-resize-handle[data-edge="right"] { right: 0; }
.mm-clip-resize-handle:hover { background: rgba(255,255,255,0.15); }
/* PR-4b: drill-in sub-row. Sits below the main day grid, spans the
   full width, hosts a left-to-right ribbon of playlist items. Each
   item is absolute-positioned with left+width % so dragging media in
   (PR4b T11) lands on the row regardless of which item is under the
   cursor. */
.mm-drillin-row { background: rgba(120, 170, 240, 0.08); border-left: 3px solid var(--accent, #6ad); border-radius: 4px; padding: 6px 8px; margin-top: 4px; }
.mm-drillin-header { display: flex; align-items: baseline; gap: 8px; font-size: 11px; margin-bottom: 4px; }
.mm-drillin-label { font-weight: 600; }
.mm-drillin-hint { color: var(--text-muted, #888); font-size: 10px; }
.mm-drillin-items { position: relative; height: 28px; background: rgba(0,0,0,0.18); border-radius: 3px; }
.mm-drillin-item { position: absolute; top: 2px; bottom: 2px; background: var(--bg-elev, #333); border-radius: 3px; padding: 0 6px; font-size: 11px; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.08); cursor: pointer; transition: outline 60ms; }
/* PR-4c gap-fix (spec §358): selected sub-item highlight. Del removes it. */
.mm-drillin-item.mm-drillin-item-selected { outline: 2px solid var(--warn, #fc6); outline-offset: 1px; background: rgba(255, 204, 102, 0.18); }
/* PR-8: drop-target highlight during sub-item drag-to-reorder. */
.mm-drillin-item.mm-drillin-drop-target { outline: 2px dashed var(--accent, #6ad); outline-offset: 1px; background: rgba(120, 170, 240, 0.22); }
.mm-drillin-row.mm-drag-target { background: rgba(120, 170, 240, 0.2); outline: 2px dashed rgba(120, 170, 240, 0.6); outline-offset: -2px; }
.mm-drillin-empty { color: var(--text-muted, #888); font-size: 11px; padding: 4px 6px; }
.mm-clip-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mm-clip-time { font-size: 10px; opacity: 0.8; }
.mm-clip-stripe {
  position: absolute; top:0; bottom:0;
  background: repeating-linear-gradient(45deg, rgba(255,0,0,0.2) 0 6px, transparent 6px 12px);
  pointer-events: none;
}
/* PR-4c gap-fix (spec §367): Week-view variant — vertical orientation
   so the stripe extends along the clip's height rather than its width.
   Overrides top/bottom (default fills vertically) with top/height %
   set by the renderer; left:0 right:0 makes it span the clip's width. */
.mm-clip-stripe-vertical { top: auto; bottom: auto; left: 0; right: 0; }
.mm-toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 0; flex-wrap: wrap; }
.mm-toolbar-date { font-weight: 600; min-width: 220px; text-align: center; }
/* PR-13: scope selector sits between "Fleet:" label and action buttons.
   Compact so it doesn't push the action row off-screen on narrower
   viewports — the dropdown only needs to show short displayIDs. */
.mm-fleet-scope { font-size: 12px; padding: 2px 4px; min-width: 80px; max-width: 160px; }
.btn-active { background: var(--accent, #345); color: white; }
.mm-toast-stack { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 6px; z-index: 1000; max-width: 360px; }
/* PR-4b T13: recurrence popover. Floats anchored under a clip; click
   outside dismisses (handler in recurrence-popover.js). */
.mm-popover { position: fixed; z-index: 1100; background: var(--bg-elev, #2a2a2a); padding: 12px; border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,0.6); min-width: 320px; color: var(--text, #eee); }
.mm-popover-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
.mm-popover-row label { font-size:12px; display:flex; align-items:center; gap:4px; }
.mm-toast { padding: 8px 12px; border-radius: 6px; background: var(--bg-elev, #2a2a2a); color: var(--text, #eee); cursor: pointer; box-shadow: 0 2px 12px rgba(0,0,0,0.5); font-size: 12px; }
.mm-toast-error { background: var(--err, #c33); }
.mm-toast-info  { background: var(--accent, #345); }
/* PR-4c: modal scaffold (modal-shell.js) */
.mm-modal-overlay { position: fixed; inset: 0; z-index: 1500; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; }
.mm-modal { background: var(--bg-elev, #2a2a2a); color: var(--text, #eee); border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.7); min-width: 360px; max-width: 90vw; max-height: 90vh; display: flex; flex-direction: column; }
.mm-modal-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.mm-modal-header h2 { font-size: 14px; margin: 0; }
.mm-modal-body { padding: 12px; overflow: auto; }
.mm-modal-close { padding: 2px 8px; min-width: auto; }
/* PR-4c T-A4: recurrence editor form + preview */
.mm-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin-bottom: 12px; }
.mm-form-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; }
.mm-form-grid label input, .mm-form-grid label select { font-size: 12px; padding: 4px; box-sizing: border-box; width: 100%; }
/* Radios + checkboxes shouldn't stretch — the width:100% rule above is
   for text/number/date inputs. Without this override the radios in
   .mm-form-row (e.g. "Never / Until / After N times") render enormous
   because they're inside .mm-form-grid labels. */
.mm-form-grid input[type="radio"],
.mm-form-grid input[type="checkbox"] { width: auto; }
.mm-form-row { grid-column: 1 / -1; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 12px; }
.mm-form-row label { flex-direction: row; gap: 4px; }
.mm-form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 12px; }
/* PR-17: horizontal-ribbon playlist editor (.mm-plr*). Replaces the
   per-item form modal. Items render as fixed-height clips sized by
   duration; sidebar form below edits the selected item. */
.mm-plr { display: flex; flex-direction: column; gap: 10px; min-width: 720px; }
.mm-plr-toolbar { display: flex; align-items: center; gap: 12px; font-size: 12px; }
.mm-plr-summary { color: var(--text-muted, #888); }
.mm-plr-ribbon-scroll { overflow-x: auto; padding-bottom: 4px; border: 1px solid rgba(255,255,255,0.08); border-radius: 4px; background: rgba(0,0,0,0.15); }
.mm-plr-ribbon { display: flex; gap: 4px; list-style: none; margin: 0; padding: 6px; min-height: 64px; min-width: 100%; box-sizing: border-box; }
.mm-plr-clip { position: relative; flex: 0 0 auto; height: 56px; padding: 4px 8px; background: var(--accent, #345); color: white; border-radius: 4px; cursor: grab; user-select: none; outline: 2px solid transparent; transition: outline-color 60ms; overflow: hidden; }
.mm-plr-clip:active { cursor: grabbing; }
.mm-plr-clip-selected { outline-color: var(--warn, #fc6); outline-offset: -2px; }
.mm-plr-clip-dragging { opacity: 0.4; }
.mm-plr-clip-title { font-weight: 500; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mm-plr-clip-dur { font-size: 10px; color: rgba(255,255,255,0.7); }
.mm-plr-resize-handle { position: absolute; top: 0; right: 0; bottom: 0; width: 10px; cursor: ew-resize; background: transparent; z-index: 2; }
.mm-plr-resize-handle:hover { background: rgba(255,255,255,0.15); }
.mm-plr-empty { color: var(--text-muted, #888); font-style: italic; padding: 16px; flex: 1 0 auto; text-align: center; }
.mm-plr-sidebar { border-top: 1px solid rgba(255,255,255,0.08); padding-top: 10px; }
.mm-plr-sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 12px; }
.mm-plr-remove { font-size: 11px; padding: 2px 8px; }
/* PR-18: video-length hint under the duration field. */
.mm-plr-duration-hint { display: block; margin-top: 2px; color: var(--text-muted, #888); font-size: 10px; }
/* PR-18: in-modal media picker. Operators can't reach the bin behind
   the modal; picker exposes the same library inline. */
.mm-plr-picker { border: 1px solid rgba(255,255,255,0.08); border-radius: 4px; padding: 8px; background: rgba(0,0,0,0.12); }
.mm-plr-picker-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 12px; }
.mm-plr-picker-search { flex: 1; font-size: 11px; padding: 2px 4px; }
.mm-plr-picker-list { list-style: none; margin: 0; padding: 0; max-height: 140px; overflow-y: auto; }
.mm-plr-picker-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 3px 4px; font-size: 11px; cursor: default; }
.mm-plr-picker-row:hover { background: rgba(255,255,255,0.05); }
.mm-plr-picker-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mm-plr-picker-meta { color: var(--text-muted, #888); font-size: 10px; }
.mm-plr-picker-add { background: transparent; border: 1px solid rgba(255,255,255,0.18); color: var(--text, #eee); padding: 0 6px; cursor: pointer; border-radius: 3px; }
.mm-plr-picker-add:hover { background: rgba(255,255,255,0.08); }
.mm-plr-picker-empty { color: var(--text-muted, #888); font-size: 11px; padding: 8px 4px; font-style: italic; }
.mm-recurrence-preview { border-top: 1px solid rgba(255,255,255,0.08); padding-top: 10px; font-size: 11px; }
.mm-recurrence-preview ol { margin: 6px 0 0 18px; padding: 0; }
.mm-recurrence-preview li { padding: 2px 0; }
.mm-recurrence-empty { color: var(--text-muted, #888); list-style: none; margin-left: -18px; }
/* PR-4c T-D1: calibration modal */
.mm-calibration .steps { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.mm-calibration .steps li { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.mm-calibration .steps .num { width: 22px; height: 22px; border-radius: 50%; background: var(--accent, #345); display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 11px; flex-shrink: 0; }
.mm-calibration-status, .mm-calibration-result { font-size: 11px; color: var(--text-muted, #888); }
.mm-calibration-result { margin: 10px 0; padding: 8px; background: rgba(0,0,0,0.2); border-radius: 4px; }
.mm-context-menu { position: fixed; z-index: 1600; background: var(--bg-elev, #2a2a2a); color: var(--text, #eee); border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; padding: 4px 0; min-width: 160px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); list-style: none; margin: 0; }
.mm-context-menu li { padding: 6px 12px; cursor: pointer; font-size: 12px; }
.mm-context-menu li:hover { background: rgba(255,255,255,0.08); }
.mm-context-menu li.mm-context-divider { padding: 0; border-top: 1px solid rgba(255,255,255,0.08); margin: 2px 0; pointer-events: none; }
.mm-context-menu li.mm-context-danger { color: var(--err, #f88); }
/* PR-4c gap-fix: track-header popover for per-client profile override (spec §362). */
.mm-thp { position: fixed; z-index: 1600; background: var(--bg-elev, #2a2a2a); color: var(--text, #eee); border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; padding: 8px 10px; min-width: 280px; max-width: 400px; max-height: 60vh; overflow-y: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5); font-size: 12px; }
.mm-thp-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.mm-thp-header strong { font-size: 12px; }
.mm-thp-hint { color: var(--text-muted, #888); font-size: 10px; }
.mm-thp-empty { color: var(--text-muted, #888); font-size: 11px; padding: 4px 0; }
.mm-thp-list { list-style: none; margin: 0; padding: 0; }
/* PR-14: 4-column row, PR-15 prefixed with a checkbox column — checkbox | name | (deviceType) | profile-select | group-select. */
.mm-thp-list li { display: grid; grid-template-columns: auto 1fr auto auto auto; gap: 6px; align-items: center; padding: 4px 0; }
.mm-thp-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mm-thp-meta { color: var(--text-muted, #888); font-size: 10px; }
.mm-thp-list select { font-size: 11px; padding: 2px 4px; max-width: 110px; }
.mm-thp-list select.mm-thp-group { border-color: rgba(255,255,255,0.18); }
/* PR-15: select-all + count tools above the list. */
.mm-thp-tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0 6px; border-bottom: 1px dashed rgba(255,255,255,0.08); margin-bottom: 4px; font-size: 11px; }
.mm-thp-count { color: var(--text-muted, #888); }
/* PR-15: bulk-move footer bar, visible when ≥1 row is selected. */
.mm-thp-bulkbar { display: none; align-items: center; gap: 8px; padding-top: 8px; margin-top: 6px; border-top: 1px solid rgba(255,255,255,0.08); }
.mm-thp-bulk-count { font-size: 11px; font-weight: 600; }
.mm-thp-bulk-target { font-size: 11px; padding: 2px 4px; flex: 1; }
.mm-track-header { cursor: pointer; }
.mm-timeline-layout { display: flex; gap: 12px; }
.mm-bin { width: 200px; flex: 0 0 200px; }
.mm-bin-section { margin-bottom: 16px; }
.mm-bin-title { font-weight: 600; margin-bottom: 6px; }
.mm-bin-list { list-style: none; padding: 0; margin: 0; max-height: 240px; overflow-y: auto; }
.mm-bin-item { padding: 4px 6px; cursor: default; }
.mm-bin-item:hover { background: rgba(255,255,255,0.05); }
/* PR-16: media bin gains a delete × button on hover. Visible-on-hover keeps the row uncluttered. */
.mm-bin-item-deletable { display: flex; align-items: center; gap: 6px; }
.mm-bin-delete { opacity: 0; background: transparent; border: 0; color: var(--text-muted, #888); font-size: 16px; line-height: 1; padding: 0 4px; cursor: pointer; }
.mm-bin-item-deletable:hover .mm-bin-delete { opacity: 1; }
.mm-bin-delete:hover { color: var(--err, #f88); }
.mm-timeline-main { flex: 1 1 auto; min-width: 0; }
/* PR-4c T-C3: profile-editor 3-pane shell */
.mm-profile-editor { display: grid; grid-template-columns: 200px 1fr 280px; gap: 10px; min-width: 900px; max-width: 1100px; min-height: 480px; }
.mm-pe-list { border-right: 1px solid rgba(255,255,255,0.08); padding-right: 8px; display: flex; flex-direction: column; gap: 6px; }
.mm-pe-list-actions { display: flex; gap: 4px; }
.mm-pe-profiles { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; font-size: 12px; }
.mm-pe-profiles li { padding: 6px 8px; cursor: pointer; border-radius: 3px; }
.mm-pe-profiles li:hover { background: rgba(255,255,255,0.06); }
.mm-pe-profiles li.selected { background: rgba(120,170,240,0.18); }
.mm-pe-form { overflow-y: auto; padding-right: 8px; min-width: 0; }
.mm-pe-empty { color: var(--text-muted, #888); padding: 12px; font-size: 12px; }
.mm-pe-preview { border-left: 1px solid rgba(255,255,255,0.08); padding-left: 8px; display: flex; flex-direction: column; gap: 6px; }
.mm-pe-preview-header { display: flex; flex-direction: column; gap: 4px; font-size: 11px; }
.mm-pe-preview-body { flex: 1; background: rgba(0,0,0,0.3); padding: 8px; font-size: 11px; white-space: pre-wrap; word-break: break-all; overflow-y: auto; min-height: 200px; }
.mm-pe-danger { color: var(--err, #f88); }
.mm-pe-unresolved { color: var(--err, #f88); font-weight: bold; }
/* PR-4c gap-fix (spec §363): fleet-action confirm modal body */
.mm-fleet-confirm { min-width: 320px; max-width: 460px; }
.mm-fleet-confirm-desc { color: var(--text-muted, #888); font-size: 12px; margin: 0 0 10px; }
.mm-fleet-confirm-summary { font-size: 13px; margin: 0 0 14px; }
.mm-fleet-confirm-summary strong { color: var(--warn, #fc6); }
.mm-fleet-confirm-danger { background: var(--err, #c33) !important; }
/* PR-4c T-C4: profile-editor form pane */
.mm-pe-script-row { display: grid; grid-template-columns: 50px 1fr; gap: 6px; align-items: center; margin-bottom: 4px; font-size: 11px; }
.mm-pe-script-row textarea { font-family: monospace; font-size: 11px; padding: 4px; box-sizing: border-box; width: 100%; }
.mm-profile-editor details { margin-bottom: 8px; }
.mm-profile-editor summary { cursor: pointer; font-size: 12px; font-weight: 600; padding: 4px 0; }
.mm-form-row-wide { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 4px; }
  </style>
</head>
<body>
<div class="app">
  <div class="statusbar">
    <span class="brand">● MosaicMesh</span>
    <span class="dot" id="connDot"></span>
    <span id="connText" class="size">connecting…</span>
    <span id="nowPlaying" class="size"></span>
    <span class="spacer"></span>
    <button class="btn btn-ghost" id="themeToggle" type="button">🌙 Theme</button>
  </div>
  <div class="shell">
    <nav class="sidebar" id="sidebar">
      <button class="navitem" data-nav="timeline">Timeline</button>
      <button class="navitem" data-nav="console">Console</button>
    </nav>
    <main class="main">
      <section class="section" data-route="timeline" x-data="{}">
        <h2>Timeline</h2>
        <div x-show="!$store.mm.hydrated && !$store.mm.hydrateError" style="color:var(--text-muted)">Loading…</div>
        <div x-show="$store.mm.hydrateError" style="color:var(--err)" x-text="'Failed to load: ' + $store.mm.hydrateError"></div>

        <div x-show="$store.mm.hydrated" class="mm-timeline-layout">
          <aside class="mm-bin">
            <div x-data="mmMediaBin" class="mm-bin-section">
              <div class="mm-bin-title">Media (<span x-text="filtered().length"></span>)</div>
              <input class="input" type="text" x-model="search" placeholder="Search…" />
              <button class="btn btn-ghost" id="mmUploadBtn" type="button" style="margin-top:6px; width: 100%;">+ Upload</button>
              <ul class="mm-bin-list">
                <template x-for="it in filtered()" :key="it.url">
                  <li class="mm-bin-item mm-bin-item-deletable"
                      draggable="true"
                      @dragstart="dragStart(it, $event)"
                      @dragend="dragEnd()">
                    <span x-text="it.name" style="flex:1; overflow:hidden; text-overflow:ellipsis;"></span>
                    <span class="size" style="color:var(--text-muted)" x-text="it.duration ? ' ' + it.duration + 's' : ''"></span>
                    <button type="button" class="mm-bin-delete" title="Delete media"
                            @click="remove(it, $event)"
                            @mousedown.stop @dragstart.stop.prevent>×</button>
                  </li>
                </template>
              </ul>
            </div>
            <div x-data="mmPlaylistBin" class="mm-bin-section">
              <div class="mm-bin-title">Playlists</div>
              <ul class="mm-bin-list">
                <template x-for="p in list" :key="p.name">
                  <li class="mm-bin-item"
                      draggable="true"
                      @dragstart="dragStart(p.name, $event)"
                      @dragend="dragEnd()"
                      x-text="p.name"></li>
                </template>
              </ul>
            </div>
          </aside>
          <div class="mm-timeline-main">
            <div x-data="mmToolbar" class="mm-toolbar">
              <button class="btn" :class="{'btn-active': $store.mm.viewMode==='day'}"   @click="setMode('day')">Day</button>
              <button class="btn" :class="{'btn-active': $store.mm.viewMode==='week'}"  @click="setMode('week')">Week</button>
              <button class="btn" :class="{'btn-active': $store.mm.viewMode==='month'}" @click="setMode('month')">Month</button>
              <button class="btn btn-ghost" @click="step(-1)">◀</button>
              <span class="mm-toolbar-date" x-text="formatDate()"></span>
              <button class="btn btn-ghost" @click="step(1)">▶</button>
              <button class="btn btn-ghost" @click="today()">Today</button>

              <template x-if="$store.mm.viewMode !== 'day'">
                <select class="input" :value="$store.mm.selectedDisplay"
                        @change="setSelectedDisplay($event.target.value)">
                  <template x-for="id in availableDisplayIds" :key="id">
                    <option :value="id" x-text="id"></option>
                  </template>
                </select>
              </template>

              <span style="flex:1"></span>
              <span class="size" style="color:var(--text-muted)">Fleet:</span>
              <select class="input mm-fleet-scope" x-model="fleetScope"
                      :title="fleetScope ? 'Fleet actions scoped to ' + fleetScope : 'Fleet actions target every device'">
                <option value="">All devices</option>
                <template x-for="id in availableDisplayIds" :key="id">
                  <option :value="id" x-text="id"></option>
                </template>
              </select>
              <button class="btn btn-ghost" @click="fleetAction('login')"  title="Wake + unlock the scoped devices (SSH)">🔓</button>
              <button class="btn btn-ghost" @click="fleetAction('start')"  title="Open the display page on the scoped devices">▶</button>
              <button class="btn btn-ghost" @click="fleetAction('stop')"   title="Close the display on the scoped devices">⏹</button>
              <button class="btn btn-ghost" @click="fleetAction('reboot')" title="Reboot the scoped devices">⟲</button>
              <button class="btn btn-ghost" @click="fleetAction('test')"   title="Open in diagnostics (?tdbg) on the scoped devices">🐞</button>
                <button class="btn btn-ghost" type="button" @click="openProfileEditor()" title="Edit profiles">⚙ Profiles</button>
                <button class="btn btn-ghost" type="button" @click="openCalibration()" title="Display calibration">🎯 Calibrate</button>
                <button class="btn btn-ghost" type="button" @click="addDisplayGroup()" title="Create a new display group">+ Group</button>
            </div>
            <div x-data="mmTimeline" x-html="render()"></div>
          </div>
        </div>
        <div x-data="mmToast" class="mm-toast-stack" x-show="items.length > 0">
          <template x-for="t in items" :key="t.id">
            <div class="mm-toast" :class="'mm-toast-' + t.kind" @click="dismiss(t.id)" x-text="t.msg"></div>
          </template>
        </div>
        <!-- PR-4b T12: hidden file picker driven by the + Upload button in the media bin. -->
        <input type="file" id="mmUploadInput" multiple accept="image/*,video/*" style="display:none">
        <!-- PR-4c: single host element for all modals. modal-shell.js
             appends an overlay+dialog and removes it on close. -->
        <div id="mmModalHost"></div>
        <!-- PR-4c: context menu overlay. context-menu.js positions this
             at the cursor + populates items. -->
        <ul id="mmContextMenu" class="mm-context-menu" style="display:none"></ul>
        <!-- PR-4c gap-fix (spec §362): per-client profile override
             popover anchored under a clicked track header. -->
        <div id="mmTrackHeaderPopover" class="mm-thp" style="display:none"></div>

      </section>
      <!-- PR-6: legacy sections (overview / displays / media / playlists /
           schedules) deleted. Their functionality lives in the timeline
           section + its modals + the toolbar buttons (fleet actions
           moved out of Overview, calibration into 🎯 modal, media into
           the mm-bin sidebar, playlists into mm-bin + playlist-editor
           modal, schedules into the timeline grid + recurrence-editor
           modal). console kept below for raw SockJS debugging. -->

      <section class="section" data-route="console"><h2>Console</h2>
<div id="log" class="panel mono" style="width: 50em; height: 20em; overflow:auto;">
</div>
<form id="chatform" class="toolbar">
  <input id="text" type="text" />
  <input id="calibrate" class="btn" type="button" value="Submit Query" onclick="sock.send(generateMessage('SRV',$('#text').val(),'null'));"/>
</form>
      </section>
    </main>
  </div>
</div>
<div class="toasts" id="toasts"></div>
<script>
function adminRoute() {
  // PR-5: default landing route is now the timeline (was 'overview' before
  // PR-4). Operators reach all other sections via the nav. Bookmarked
  // URLs with explicit hashes (#displays, #overview, etc.) still resolve.
  var r = (location.hash || "#timeline").slice(1);
  var found = false;
  $('.section').each(function(){ var on = $(this).data('route') === r; $(this).toggleClass('active', on); if(on) found=true; });
  if (!found) { $('.section[data-route=timeline]').addClass('active'); r = "timeline"; }
  $('.navitem').each(function(){ $(this).toggleClass('active', $(this).data('nav') === r); });
}
$(function(){
  $('.navitem').on('click', function(){ location.hash = $(this).data('nav'); });
  $(window).on('hashchange', adminRoute);
  adminRoute();
});
function adminApplyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  $('#themeToggle').text(t === 'light' ? '☀ Light' : '🌙 Dark');
}
$(function(){
  var stored = null;
  try { stored = localStorage.getItem('adminTheme'); } catch(e) {}
  if (!stored) { stored = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark'; }
  adminApplyTheme(stored);
  $('#themeToggle').on('click', function(){
    var t = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    adminApplyTheme(t);
    try { localStorage.setItem('adminTheme', t); } catch(e) {}
  });
});
</script>
</body>
</html>
