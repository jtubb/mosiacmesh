<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- Webapp mode for iPad kiosk operation. When the operator
       adds this page to the home screen (Safari -> Share ->
       Add to Home Screen), launching from that icon runs the
       page CHROME-LESS: no URL bar, no tab bar, no status bar
       (with apple-mobile-web-app-status-bar-style=black-translucent).
       The video element at position:fixed 100%/100% then fills the
       iPad screen permanently, no native-fullscreen handoff
       needed. Solves the "fullscreen lost on second video"
       iOS-5 limitation (webkitEnterFullscreen can't be called
       again without a new user gesture). Standard kiosk
       deployment pattern; no effect if launched via Safari URL. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, minimum-scale=1, maximum-scale=1">
  <script src="/js/jquery.min.js"></script>
  <script src="/js/sockjs.min.js"></script>
  <script src="/js/GoTime.js"></script>
  <script src="/js/mosiacmesh.js"></script>
  <script src="/js/animations.js"></script>
  <script>
    var blink = true;
    // Tracks whether we have already told the server "my
    // ProgrammableTimer is synced" since our LAST sock-open. Reset to
    // false on disconnect (when sock becomes null) so the next
    // converge+connect cycle re-emits SYNACK to the server -- the
    // server clears client.synced on disconnect, so we have to
    // re-announce after every reconnect.
    var _mmSyncedSent = false;
    function tickcallback(currentTime,currentTarget,drift_correction)
    {
        if(sock == null)
        {
            _mmSyncedSent = false;   // re-emit SYNACK on next reconnect+sync
            reconnectWatchdog();   // guarded reconnect (no overlapping handshakes)
        }
        // The tick fires on the synchronized GoTime second: record its phase and
        // beat the indicator so all displays pulse together.
        recordTickPhase(currentTime);
        _lastTickAt = Date.now();
        triggerPulse();
        if(ProgrammableTimer.isSynced())
        {
            // One-shot announce: tell the server our clock has converged
            // (jitter within tolerance over the rolling drift_history
            // window). The server's SYNACK handler sets
            // client.synced=True, which _begin_prepare uses to gate
            // PREPARE delivery to clients whose clocks are stable.
            if (!_mmSyncedSent && sock !== null &&
                typeof SockJS !== "undefined" && sock.readyState === SockJS.OPEN) {
                try {
                    sock.send(generateMessage("SRV", "SYNACK", getUDID()));
                    _mmSyncedSent = true;
                } catch (e) { /* try again next tick */ }
            }
			if(blink && !playback.active)
			{
				if((Math.round(currentTime/1000)*1000)%2000 == 0)
				{
					$('#canvas').text("TICK").css('font-size','8vw');
				}
				else
				{   
					$('#canvas').text("TOCK").css('font-size','8vw');
				}
			}
        }
        else if (blink)
        {
            // Only overwrite the canvas with the "syncing..." placeholder
            // while blink is true (the pre-play TICK/TOCK idle state).
            // calibrate/identify/play/stop handlers all set blink=false
            // because they’ve installed their own canvas content
            // (ArUco marker, identify label, video, etc.) and the tick
            // callback must not clobber it -- which it WAS doing whenever
            // ProgrammableTimer’s _synced flapped to false, briefly
            // replacing the marker with "Synching to time server...".
            $('#canvas').text("Synching to time server...").css('font-size','8vw');
        }
        //console.log(currentTime + "," +currentTarget + "," + drift_correction+"," + (1000-drift_correction)+","+(currentTarget-currentTime));
    }
    
    ProgrammableTimer.setup(1000,tickcallback);
	
	var mediaSequence = null;
	var mediaReady = false;
	var playback = { items: [], startEpoch: 0, loop: false, active: false, timer: null,
		video: null, videoIndex: -1, driftTimer: null, paused: false, startTimer: null,
		scriptRaf: null, scriptIndex: -1,
		// Adaptive seek-ahead: a hard seek on the iPad-1 settles ~latency late (the
		// shared clock advances during the rebuffer), so seeking to the exact target
		// lands ~that-latency behind and stays there (iOS-5 can't rate-correct). We
		// seek to target+seekAheadMs and tune seekAheadMs from each seek's residual so
		// it converges to the device's seek latency (~200ms observed on iPad-1; fast
		// devices tune it back toward 0). Start near the iPad estimate for fast convergence.
		seekAheadMs: 200, seekPending: false, lastSeekAt: 0,
		// iOS (esp. iPad 1 / iOS 5) won't start <video> without a user gesture and
		// the activation does NOT transfer to a freshly-created element. So we reuse
		// ONE persistent <video> (pvid) across items and bless it once via a tap
		// (see #tapstart). pvid persists across items; videoSrc tracks its loaded src.
		pvid: null, activated: false, videoSrc: null, armTimer: null, _armPlaying: null,
		boundaryTimer: null };

	// Play video UNMUTED. Restores sound on every screen, at the cost of needing
	// a tap-to-start (a muted <video> is exempt from autoplay policy and would
	// start without a gesture, but iOS+Safari require a real user gesture before
	// PLAYING with audio). The same tap is used to enter native fullscreen on
	// iPad (see activatePlayback -> webkitEnterFullscreen). When the playlist
	// transitions to a non-video item, clearVideo flips v.muted back to true so
	// the still-running keep-alive element doesn't bleed audio behind the
	// non-video content. Flip to true to restore the silent-kiosk mode (no tap,
	// no audio).
	var VIDEO_MUTED = false;

	// One persistent video element, created once and reused for every video item
	// so a single user gesture keeps the whole session playable on iOS.
	function getPersistentVideo() {
		if (!playback.pvid) {
			var v = document.createElement('video');
			v.muted = VIDEO_MUTED; // unmuted only when audio is wanted (needs a gesture)
			v.setAttribute('webkit-playsinline', '');
			v.setAttribute('playsinline', '');
			v.preload = 'auto';
			// Lock the video to the viewport itself (position:fixed, full size). It
			// is appended to <body>, NOT #canvas — #canvas is transform-centered,
			// which (a) is a containing block that would trap a fixed child and
			// (b) mis-positions under scroll on iOS-5. Explicit 100%/100% also sizes
			// it (iOS-5 won't auto-size a <video> to its content).
			v.style.position = 'fixed';
			v.style.left = '0'; v.style.top = '0';
			v.style.width = '100%'; v.style.height = '100%';
			v.style.background = '#000';
			v.style.zIndex = '1';
			v.style.display = 'none';
			// Once the video actually starts (modern autoplay, the muted fallback,
			// or a post-tap play), drop the overlay and mark the session active. On
			// iPad 1 'playing' won't fire until the gesture, so the overlay persists.
			v.addEventListener('playing', function () { playback.activated = true; hideTapStart(); });
			document.body.appendChild(v);
			playback.pvid = v;
		}
		return playback.pvid;
	}
	var HARD_SEEK_MS = 750; // drift beyond this is corrected with a seek, not a rate nudge
	                        // (must exceed typical seek+rebuffer latency or playback chases its own tail)
	var KEYFRAME_GRID_MS = 250;  // MUST match server KEYFRAME_GRID_SEC (0.25s): drift
	                             // re-aligns by seeking to this keyframe grid so iOS-5
	                             // (keyframe-accurate seek) and modern clients land on
	                             // the same frame -> the wall agrees with itself.
	// Drift past this triggers a BOUNDARY-aligned re-align seek (see driftTick). With
	// boundary alignment the residual is the lead-estimate error + timer jitter, NOT a
	// grid-snap, so the threshold is jitter-based (not grid-relative): high enough that
	// jitter doesn't trigger needless re-seeks once converged (each seek stalls the
	// iPad), low enough to re-align on real drift. iOS-5 IGNORES playbackRate (verified:
	// set 1.15 but currentTime advances 1.0x), so a seek is the only lever there.
	var DRIFT_SEEK_MS = 30;   // 2026-06-15: lowered from 100. iOS-5 ignores playbackRate, so the
	                          // in-band rate-nudge is a no-op; a seek-landing residual below the
	                          // threshold was trapped (the lead-tuner only runs on a seek). 30 lets
	                          // sub-100ms residuals re-seek -> the lead converges -> seeks land near
	                          // 0. Fleet-validated: drift median 37->11ms, max 100->25ms, modest
	                          // extra seeks (cheap now that segments are cached on-device). NOTE: a
	                          // capability-aware two-strategy variant (direct exact seek for modern)
	                          // was tried + reverted -- direct seeks fail on iOS-5 (keyframe-snap +
	                          // uncompensated seek latency), and the boundary-aligned keyframe seek
	                          // below works on iOS-5 AND modern, so one path is correct for both.
	var SEEK_COOLDOWN_MS = 2500; // min gap between hard seeks: a seek must be given
	                             // time to settle + establish playback before another,
	                             // else a slow/stalled element gets re-seeked every tick
	                             // and stays stuck at currentTime 0 (never plays).

	// Optional on-screen timing HUD. Open the page with ?tdbg to diagnose sync /
	// flashing on a device: live clock(el) vs video(ct), drift(err), look-ahead,
	// and a tick counter (rapidly climbing # == a re-render/flash loop). Element
	// is created lazily on first use (the <video> is in <body> by then). ES5-safe.
	if (/tdbg/.test(location.href)) {
		window._mmDbg = true;   // also stream debug to the server log (CLIENTLOG)
		window._tdbg = function(pos, v, errorMs) {
			var el = document.getElementById('tdbg');
			if (!el) {
				if (!document.body) { return; }
				el = document.createElement('div'); el.id = 'tdbg';
				el.style.cssText = 'position:fixed;left:0;bottom:0;z-index:99999;' +
					'background:rgba(0,0,0,0.7);color:#0f0;font:12px monospace;' +
					'padding:3px 5px;white-space:pre;pointer-events:none;';
				document.body.appendChild(el);
				window._tdbgN = 0;
			}
			window._tdbgN++;
			var elapsed = GoTime.now() - playback.startEpoch;
			el.textContent = 'idx=' + (pos ? pos.index : '-') +
				' off=' + (pos ? Math.round(pos.offsetMs) : '-') +
				' ct=' + (v ? Math.round(v.currentTime * 1000) : '-') +
				' err=' + Math.round(errorMs) +
				' ahead=' + Math.round(playback.seekAheadMs) +
				' rs=' + (v ? v.readyState : '-') +
				' el=' + Math.round(elapsed) +
				' r=' + (window._mmRenderN || 0) + ' #' + window._tdbgN;
		};
		// Always-on persistent-<video> state line (updates during PREPARE/arming,
		// when the drift HUD above isn't running). Shows why a tap doesn't start:
		// verr=decode/network error code, rs/ns=ready/network state, evt=last media
		// event. ES5-safe. pointer-events:none so it never blocks the tap overlay.
		window._mmVidEvt = '-';
		setInterval(function () {
			var v = playback.pvid;
			var el2 = document.getElementById('tdbg2');
			if (!el2) {
				if (!document.body) { return; }
				el2 = document.createElement('div'); el2.id = 'tdbg2';
				el2.style.cssText = 'position:fixed;left:0;bottom:20px;z-index:99999;' +
					'background:rgba(0,0,0,0.7);color:#ff0;font:12px monospace;' +
					'padding:3px 5px;white-space:pre;pointer-events:none;';
				document.body.appendChild(el2);
			}
			if (v && !v._mmEvtHooked) {
				v._mmEvtHooked = true;
				var names = ['loadstart', 'loadedmetadata', 'loadeddata', 'playing', 'error', 'stalled', 'waiting', 'pause', 'canplay', 'suspend', 'abort'];
				var mk = function (n) { return function () { window._mmVidEvt = n + (v.error ? ('/e' + v.error.code) : ''); dbg('vid:' + n); }; };
				var i; for (i = 0; i < names.length; i++) { v.addEventListener(names[i], mk(names[i]), false); }
			}
			el2.textContent = 'arm activated=' + playback.activated +
				' paused=' + (v ? v.paused : '-') +
				' rs=' + (v ? v.readyState : '-') +
				' ns=' + (v ? v.networkState : '-') +
				' verr=' + (v && v.error ? v.error.code : '-') +
				' src=' + (v && v.getAttribute('src') ? '1' : '0') +
				' evt=' + window._mmVidEvt;
		}, 500);
	}

	// JS mirror of server.playlist_index — keep the two in sync.
	function playlistIndex(elapsedMs, durations, loop) {
		var total = 0, i;
		for (i = 0; i < durations.length; i++) { total += durations[i]; }
		if (total <= 0) { return null; }
		if (loop) { elapsedMs = ((elapsedMs % total) + total) % total; }
		else if (elapsedMs >= total) { return null; }
		if (elapsedMs < 0) { elapsedMs = 0; }
		var cum = 0;
		for (i = 0; i < durations.length; i++) {
			if (elapsedMs < cum + durations[i]) { return { index: i, offsetMs: elapsedMs - cum }; }
			cum += durations[i];
		}
		return { index: durations.length - 1, offsetMs: durations[durations.length - 1] };
	}

	function isVideoItem(file) {
		// Mirror server.isVideoItem (_VIDEO_EXTS). ES5-safe regex.
		return /\.(mp4|mov|m4v|webm|ogv)(\?|$)/i.test(file || '');
	}

	function showTapStart() { var el = document.getElementById('tapstart'); if (el) { el.style.display = 'block'; } }
	function hideTapStart() { var el = document.getElementById('tapstart'); if (el) { el.style.display = 'none'; } }

	// Called from the #tapstart overlay's tap handler — a real user gesture.
	// iOS-5 only begins LOADING a <video> from a gesture-triggered play(), and the
	// gesture is voided by any DOM mutation / async deferral before play(). So do
	// load()+play() FIRST and nothing else; the 'playing' listener (in
	// getPersistentVideo) dismisses the overlay, and the drift loop syncs position.
	function activatePlayback() {
		dbg("tap");
		var v = getPersistentVideo();
		v.style.display = 'block';
		// Register a one-shot fullscreen-request listener BEFORE load+play.
		// iPad-1 / iOS 5 only exposes webkitEnterFullscreen() on <video>
		// (no Element.requestFullscreen until iOS 12). Calling it
		// synchronously right after v.play() doesn't reliably fullscreen
		// because readyState is still 0 at that point. Registering the
		// listener INSIDE the user gesture and firing webkitEnterFullscreen
		// on the first 'playing' event lets iOS preserve gesture context
		// through the short async chain -- the canonical way to defer
		// fullscreen on iPad-1.
		var enterFS = function () {
			v.removeEventListener('playing', enterFS);
			try { if (v.webkitEnterFullscreen) { v.webkitEnterFullscreen(); } } catch (e) {}
		};
		try { v.addEventListener('playing', enterFS); } catch (e) {}
		// iOS-5 Safari needs load()+play() TOGETHER inside the tap gesture to start
		// a held/paused element (play() alone won't restart it). The PREPARE
		// loadedmetadata handler is one-shot (removes itself), so this load() can't
		// re-trigger the hold. ES5/iOS-5 proven arming sequence.
		try { v.load(); } catch (e) {}
		try {
			var p = v.play();
			if (p && p['catch']) {
				p['catch'](function () { v.muted = true; var q = v.play(); if (q && q['catch']) { q['catch'](function () {}); } });
			}
		} catch (e) {}
		dbg('arm-play');   // tdbg: confirms the (real or synthetic) tap reached play()
		// Do NOT optimistically set activated here: a synthetic/blocked tap (e.g. an
		// auto-arm VNC tap on iOS 5, where play() needs a REAL gesture) would falsely
		// mark us armed and suppress the prompt while the video stays paused. The
		// 'playing' listener (getPersistentVideo) sets activated only once it actually
		// starts, and hides the overlay then.
		return false;
	}

	function showBlackout() { var el = document.getElementById('blackout'); if (el) { el.style.display = 'block'; } }
	function hideBlackout() { var el = document.getElementById('blackout'); if (el) { el.style.display = 'none'; } }

	function sendMsg(request, payload) {
		try { sock.send(generateMessage("SRV", request, payload)); } catch (e) {}
	}

	// Stream client debug state to the server log (opt-in via ?tdbg) so device
	// behavior is visible without reading an on-screen HUD. ES5-safe.
	function dbg(tag, extra) {
		if (!window._mmDbg) { return; }
		var v = playback.pvid;
		var payload = {
			tag: tag,
			activated: playback.activated, active: playback.active,
			paused: v ? v.paused : null,
			rs: v ? v.readyState : null, ns: v ? v.networkState : null,
			verr: (v && v.error) ? v.error.code : null,
			ct: v ? Math.round(v.currentTime * 1000) : null,
			src: (v && v.getAttribute('src')) ? ('' + v.getAttribute('src')).split('/').pop() : null,
			idx: playback.videoIndex,
			elapsed: playback.startEpoch ? Math.round(GoTime.now() - playback.startEpoch) : null,
			off: (typeof GoTime.getOffset === 'function') ? GoTime.getOffset() : null,
			prec: (typeof GoTime.getPrecision === 'function') ? GoTime.getPrecision() : null,
			accAge: (typeof GoTime.msSinceAccept === 'function' && GoTime.msSinceAccept() !== Infinity) ? Math.round(GoTime.msSinceAccept()) : null,
			phStd: (function () { var s = phaseStats(); return s ? Math.round(s.std) : null; })(),
			phMean: (function () { var s = phaseStats(); return s ? Math.round(s.mean) : null; })(),
			phMedAbs: (function () { var s = phaseStats(); return s ? Math.round(s.medAbs) : null; })(),
			synced: (typeof ProgrammableTimer !== 'undefined') ? ProgrammableTimer.isSynced() : null,
			settled: clockSettled(),
			cready: clockReady()
		};
		if (extra) { for (var k in extra) { if (extra.hasOwnProperty(k)) { payload[k] = extra[k]; } } }
		sendMsg("CLIENTLOG", payload);
	}

	// Undo the calibrate view's <html> framing (8px border + window-16 sizing) and
	// its white page override, returning to the black playback background.
	function exitCalibrateView() {
		$('html').css({ width: '', height: '', border: '', position: '', 'z-index': '', overflow: '' });
		$('html, body').css('background-color', '');
		$('#canvas').css({ color: '' });
	}

	// Emit READY only once the clock is converged (clockReady). Re-checks on a
	// short timer until then; the server's extended PREPARE_TIMEOUT is the
	// bounded fallback if a client never converges. Guarded by the current
	// prepareId so a stopped/superseded PREPARE can't later emit a stale READY.
	function sendReadyWhenClockReady(prepareId) {
		if (playback.readyWaitTimer) { clearTimeout(playback.readyWaitTimer); playback.readyWaitTimer = null; }
		function attempt() {
			if (playback.prepareId !== prepareId) { return; }   // superseded/stopped
			if (clockReady()) {
				dbg("send-READY");
				sendMsg("READY", { prepareId: prepareId });
				return;
			}
			dbg("hold-READY-clock");
			playback.readyWaitTimer = setTimeout(attempt, 500);
		}
		attempt();
	}

	// Coordinated-start phase 1: buffer the first item and HOLD frame 0 (paused).
	// Report READY when buffered (and armed, for gesture devices). A gesture device
	// that is not yet armed reports NEEDS_ARM and, when the arming touch lands,
	// "arm-then-hold": let play() fire to consume the gesture, then pause back to 0
	// and send READY. The server's GO (PLAY with a future startEpoch) releases us.
	function prepareFirstItem(prepareId) {
		clearScript();
		if (playback.armTimer) { clearTimeout(playback.armTimer); playback.armTimer = null; }
		// Arm/buffer off the first VIDEO item in the playlist — the gesture is
		// needed before the first video plays, even if item 0 is a non-video (e.g.
		// a SCRIPT animation). The persistent <video> is reused for every video
		// item, so blessing it once (with the first video's src) arms them all.
		var item = null, i;
		for (i = 0; i < playback.items.length; i++) {
			if (isVideoItem(playback.items[i].file)) { item = playback.items[i]; break; }
		}
		if (!item) { sendReadyWhenClockReady(prepareId); return; }  // no video to arm; still wait for clock
		var v = getPersistentVideo();
		v.style.display = 'block'; v.style.opacity = '1'; v.loop = false; v.muted = VIDEO_MUTED;
		playback.videoSrc = item.file;
		var holdAtZero = function () {
			try { v.pause(); } catch (e) {}
			try { v.currentTime = 0; } catch (e) {}
		};
		var reportReady = function () { sendReadyWhenClockReady(prepareId); };
		var onArmed = function () {            // 'playing' fired => armed (autoplay or tap)
			if (playback.armTimer) { clearTimeout(playback.armTimer); playback.armTimer = null; }
			playback.activated = true; hideTapStart();
			holdAtZero(); reportReady();
		};
		if (v.getAttribute('src') !== item.file) { v.src = item.file; try { v.load(); } catch (e) {} }
		if (playback.activated) {
			// Already blessed this session: the element can (re)load + play
			// programmatically, so just buffer + hold 0 and report READY; GO starts it.
			holdAtZero(); reportReady(); return;
		}
		// Not yet blessed -> ARM NOW, during PREPARE, so GO can start the clip
		// PROGRAMMATICALLY in sync with displays that autoplay (instead of the iPad
		// first showing a tap prompt at GO, after the balls). Do NOT wait for
		// loadedmetadata: iOS 5 won't fetch even metadata without a user gesture, so
		// that event never fires pre-tap. Instead attempt muted autoplay (modern starts
		// -> 'playing' -> onArmed -> READY, no visible tap), and on a fixed grace show
		// the tap prompt + NEEDS_ARM if we still haven't started (iOS 5). The human tap
		// (activatePlayback -> load()+play() in the gesture) loads + blesses it; the
		// server holds GO until every display is READY, so the wall starts together.
		if (playback._armPlaying) { try { v.removeEventListener('playing', playback._armPlaying); } catch (e) {} }
		playback._armPlaying = function () { v.removeEventListener('playing', playback._armPlaying); playback._armPlaying = null; onArmed(); };
		v.addEventListener('playing', playback._armPlaying);
		if (VIDEO_MUTED) { var pp = v.play(); if (pp && pp['catch']) { pp['catch'](function () {}); } }
		playback.armTimer = setTimeout(function () {
			if (!playback.activated) {
				dbg("send-NEEDS_ARM"); sendMsg("NEEDS_ARM", { prepareId: prepareId });
				showTapStart();           // human tap (activatePlayback -> load()+play()) blesses it
			}
		}, 700);
	}

	function clearVideo() {
		if (playback.driftTimer) { clearInterval(playback.driftTimer); playback.driftTimer = null; }
		var v = playback.pvid;
		if (v && playback.activated && v.getAttribute('src')) {
			// Exit iOS native fullscreen so the next non-video item
			// (bouncingBalls SCRIPT, image, etc.) is visible. Without
			// this, the fullscreen video player keeps covering the
			// screen with the looping muted video. Safe to call when
			// not in fullscreen -- iOS no-ops it then.
			try { if (v.webkitExitFullscreen) { v.webkitExitFullscreen(); } } catch (e) {}
			// PAUSE the video to definitively stop audio. The previous
			// keep-alive design (play it muted+looping+transparent) was
			// chosen to preserve iOS-5 user-activation so subsequent
			// play() calls would work programmatically -- BUT iPad-1's
			// HTMLMediaElement does NOT reliably honor a mid-playback
			// v.muted=true on the element, so audio kept bleeding into
			// non-video items. Pause is the only reliable mute on
			// iPad-1. If the next video's play() turns out to be blocked
			// without a fresh gesture, the existing showTapStart() path
			// in showItem (the !activated branch) re-prompts.
			v.muted = true; v.volume = 0;
			try { v.pause(); } catch (e) {}
			v.style.opacity = '0';
			// Force the audio decoder to release: setting currentTime
			// without a subsequent play() leaves the element paused
			// AND seeks to the requested position so the next play()
			// resumes cleanly (or shows the tap prompt if blocked).
		} else if (v) {
			// Not yet gesture-blessed (nothing to preserve): just hide it.
			try { v.pause(); } catch (e) {}
			v.style.display = 'none';
		}
		playback.video = null;
		playback.videoIndex = -1;
	}

	var _raf = window.requestAnimationFrame || window.webkitRequestAnimationFrame ||
		function(cb){ return setTimeout(cb, 16); };
	var _caf = window.cancelAnimationFrame || window.webkitCancelAnimationFrame ||
		function(id){ clearTimeout(id); };

	// Animations now live in the shared ES5 module js/animations.js (loaded above

				exitCalibrateView();
				hideBlackout();
				playback.items = data_obj.PAYLOAD.items || [];
				playback.loop = !!data_obj.PAYLOAD.loop;
				playback.active = false;
				playback.paused = false;
				playback.prepareId = data_obj.PAYLOAD.prepareId;
				if (typeof GoTime.resync === 'function') { GoTime.resync(4, 400); }
				dbg("recv-PREPARE");
				prepareFirstItem(data_obj.PAYLOAD.prepareId);
			}
			else if(data_obj.REQUEST == "PLAY")
			{
				blink = false;
				exitCalibrateView();   // undo calibrate <html> framing + white page
				hideBlackout();        // lift the 'stopped' cover from a prior keep-alive
				playback.items = data_obj.PAYLOAD.items || [];
				playback.startEpoch = data_obj.PAYLOAD.startEpoch;
				playback.loop = !!data_obj.PAYLOAD.loop;
				playback.active = true;
				playback.paused = false;
				dbg("recv-PLAY");
				if (playback.startTimer) { clearTimeout(playback.startTimer); playback.startTimer = null; }
				var _delay = playback.startEpoch - GoTime.now();
				// Defer ONLY for a plausible coordinated GO (the start epoch is at most
				// ~RELEASE_LEAD_MS ahead). A large delay means the clock isn't synced
				// yet (e.g. just reconnected) or the epoch is stale; a <=0 delay is a
				// past epoch (late-join / resume / reconnect). Both start immediately so
				// we never hang waiting on a bogus future time.
				if (_delay > 0 && _delay < 3000) {
					// Holding frame 0 from PREPARE — release at the shared start epoch.
					playback.startTimer = setTimeout(function () { renderPlayback(); }, _delay);
				} else {
					renderPlayback();
				}
			}
			else if(data_obj.REQUEST == "STOP")
			{
				stopPlayback();
			}
			else if(data_obj.REQUEST == "PAUSE")
			{
				pausePlayback();
			}
		}
	}

	$.fn.center = function () {
	   this.css("position","absolute");
	   this.css("top", ( $(window).height() - this.height() ) / 2  + "px");
	   this.css("left", ( $(window).width() - this.width() ) / 2 + "px");
	   return this;
	}

	mosiacMeshConnect(mosiacMeshCallback);
  </script>
  <style>
	/* Full-bleed black page: kills the default 8px body margin (white strip at
	   the top/edges) and any white background behind the video/UI. Default
	   text color is white so the pre-playback canvas labels (TICK/TOCK,
	   IDENTIFY, "Synching to time server...") are visible on the black page;
	   calibrate mode explicitly flips to black-on-white. */
	html, body { margin: 0; padding: 0; height: 100%; background: #000; color: #fff; overflow: hidden; }
	.canvas {
		width: 100%;
		-webkit-transform: translateX(-50%) translateY(-50%);
		transform: translateX(-50%) translateY(-50%);
		position: absolute; /*or fixed*/
		left: 50%;
		top: 50%;
		text-align: center;
	}
	/* Heartbeat status indicator (shaded sphere, top-right) */
	#heartbeat {
		position: fixed;
		top: 10px;
		right: 10px;
		width: 20px;
		height: 20px;
		border-radius: 50%;
		z-index: 9999;
		-webkit-box-shadow: inset -3px -3px 5px rgba(0,0,0,0.45), 0 0 4px rgba(0,0,0,0.4);
		box-shadow: inset -3px -3px 5px rgba(0,0,0,0.45), 0 0 4px rgba(0,0,0,0.4);
		/* One-shot 1s beat, (re)triggered each synchronized timer tick so all
		   displays pulse together (see triggerPulse / tickcallback). Falls back
		   to the local 1s refresh before the clock is synced. */
		-webkit-animation-name: none;
		animation-name: none;
		-webkit-animation-duration: 1s;
		animation-duration: 1s;
		-webkit-animation-timing-function: ease-out;
		animation-timing-function: ease-out;
		-webkit-animation-iteration-count: 1;
		animation-iteration-count: 1;
	}
	@-webkit-keyframes hb-pulse {
		0%   { -webkit-transform: scale(1.0);  opacity: 0.85; }
		20%  { -webkit-transform: scale(1.28); opacity: 1; }
		100% { -webkit-transform: scale(1.0);  opacity: 0.85; }
	}
	@keyframes hb-pulse {
		0%   { transform: scale(1.0);  opacity: 0.85; }
		20%  { transform: scale(1.28); opacity: 1; }
		100% { transform: scale(1.0);  opacity: 0.85; }
	}
	/* solid background-color is the iOS-5 fallback if radial-gradient is unsupported */
	.hb-red {
		background-color: #d63a2a;
		background: -webkit-radial-gradient(32% 30%, circle, #ff9080, #b21f0f 78%);
		background: radial-gradient(circle at 32% 30%, #ff9080, #b21f0f 78%);
	}
	.hb-orange {
		background-color: #e07b1a;
		background: -webkit-radial-gradient(32% 30%, circle, #ffc080, #c25e00 78%);
		background: radial-gradient(circle at 32% 30%, #ffc080, #c25e00 78%);
	}
	.hb-yellow {
		background-color: #e6c200;
		background: -webkit-radial-gradient(32% 30%, circle, #fff39a, #c8a400 78%);
		background: radial-gradient(circle at 32% 30%, #fff39a, #c8a400 78%);
	}
	.hb-green {
		background-color: #1f9d4d;

		background: radial-gradient(circle at 32% 30%, #9bf0a0, #137a37 78%);

	<div id="heartbeat" class="hb-red"></div>
	<div id="canvas" class="canvas"></div>
	<!-- iOS needs a user gesture to start <video>; this full-screen overlay is the
	     tap target (a person or the gesture/SSH script taps it once per session).
	     Inline handlers + px units for 1st-gen iPad / iOS 5 compatibility. -->
	<div id="tapstart" onclick="return activatePlayback();" ontouchend="return activatePlayback();" ontouchstart="return activatePlayback();"
	     style="display:none; position:fixed; left:0; top:0; width:100%; height:100%; z-index:1000;
	            background:#000; color:#fff; text-align:center; font-size:28px; cursor:pointer;">
		<div style="margin-top:42%;">&#9658; Tap to start</div>
	</div>
	<!-- 'Stopped' cover: black screen over the persistent video, which is kept
	     playing (muted, looping) behind it to preserve iOS user-activation. -->
	<div id="blackout" style="display:none; position:fixed; left:0; top:0; width:100%; height:100%; z-index:2; background:#000;"></div>
	<div id="preload" class="preload"></div>
	<script>
// Service Worker registration -- modern devices only. iOS 5 Safari
// has navigator.serviceWorker == undefined; the if-guard makes this
// block a no-op there. (The Promise-chain syntax (.then) is fine
// for iOS 5 to PARSE -- it only fails to execute, and we never enter
// the if branch on iOS 5.) See spec
// docs/superpowers/specs/2026-06-03-media-cache-design.md Task 13.
(function(){
	try {
		if (navigator && navigator.serviceWorker) {
			navigator.serviceWorker.register('/sw.js').then(function(reg){
				if (navigator.serviceWorker.controller) {
					announceCacheMode();
				} else {
					navigator.serviceWorker.addEventListener('controllerchange',
						announceCacheMode);
				}
			}).catch(function(){
				// SW registration failed (e.g., file 404). Don't announce
				// -- server keeps this client at cacheMode="none".
			});
		}
	} catch (e) { /* iOS 5 with modern syntax errors -- ignore */ }
})();

function announceCacheMode(){
	try {
		if (typeof sock === "undefined" || sock === null) return;
		sock.send(generateMessage("SRV", "ANNOUNCE_CACHE_MODE",
								  {"mode": "service-worker"}));
	} catch (e) { /* best-effort */ }
}

// Called by the existing PRELOAD message handler when running on a
// modern device. Issues a non-Range fetch() for each new SEGMENT URL,
// which populates the Service Worker's Cache API. Subsequent <video>
// Range requests get sliced from the cached body.
function prefetchPlaylistMedia(items){
	if (!('caches' in window)) return;  // SW not supported -> no-op
	if (!items || !items.length) return;
	for (var i = 0; i < items.length; i++){
		var it = items[i];
		if (it.playmode !== "SEGMENT") continue;
		if (!it.file) continue;
		try {
			// fire-and-forget; SW intercepts and populates cache.
			fetch(it.file, { mode: 'cors', cache: 'no-store' }).catch(function(){});
		} catch (e) { /* ES5-incompatible browser -- ignore */ }
	}
}
	</script>
