<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="/js/jquery.min.js"></script>
  <script src="/js/sockjs.min.js"></script>
  <script src="/js/GoTime.js"></script> 
  <script src="/js/mosiacmesh.js"></script>
  <script>
    var blink = true;
    function tickcallback(currentTime,currentTarget,drift_correction)
    {
        if(sock == null)
        {
            reconnectWatchdog();   // guarded reconnect (no overlapping handshakes)
        }
        // The tick fires on the synchronized GoTime second: record its phase and
        // beat the indicator so all displays pulse together.
        recordTickPhase(currentTime);
        _lastTickAt = Date.now();
        triggerPulse();
        if(ProgrammableTimer.isSynced())
        {
			if(blink && !playback.active)
			{
				if((Math.round(currentTime/1000)*1000)%2000 == 0)
				{
					$('#canvas').text("TICK").css('font-size','8vw');
				}
				else
				{   
					$('#canvas').text("TOCK").css('font-size','8vw');
				}
			}
        }
        else
        {
            $('#canvas').text("Synching to time server...").css('font-size','8vw');
        }
        //console.log(currentTime + "," +currentTarget + "," + drift_correction+"," + (1000-drift_correction)+","+(currentTarget-currentTime));
    }
    
    ProgrammableTimer.setup(1000,tickcallback);
	
	var mediaSequence = null;
	var mediaReady = false;
	var playback = { items: [], startEpoch: 0, loop: false, active: false, timer: null,
		video: null, videoIndex: -1, driftTimer: null, paused: false, startTimer: null,
		scriptRaf: null, scriptIndex: -1,
		// Adaptive seek-ahead: on slow devices (iPad 1) a hard seek takes ~1s to
		// land, so seeking to the exact clock target lands late and playback never
		// catches up. We seek to target+seekAheadMs and tune seekAheadMs from the
		// residual error after each seek settles (0 on fast devices => no change).
		seekAheadMs: 0, seekPending: false, lastSeekAt: 0,
		// iOS (esp. iPad 1 / iOS 5) won't start <video> without a user gesture and
		// the activation does NOT transfer to a freshly-created element. So we reuse
		// ONE persistent <video> (pvid) across items and bless it once via a tap
		// (see #tapstart). pvid persists across items; videoSrc tracks its loaded src.
		pvid: null, activated: false, videoSrc: null };

	// One persistent video element, created once and reused for every video item
	// so a single user gesture keeps the whole session playable on iOS.
	function getPersistentVideo() {
		if (!playback.pvid) {
			var v = document.createElement('video');
			v.muted = false; // audio on every screen once the element is gesture-blessed
			v.setAttribute('webkit-playsinline', '');
			v.setAttribute('playsinline', '');
			v.preload = 'auto';
			// Lock the video to the viewport itself (position:fixed, full size). It
			// is appended to <body>, NOT #canvas — #canvas is transform-centered,
			// which (a) is a containing block that would trap a fixed child and
			// (b) mis-positions under scroll on iOS-5. Explicit 100%/100% also sizes
			// it (iOS-5 won't auto-size a <video> to its content).
			v.style.position = 'fixed';
			v.style.left = '0'; v.style.top = '0';
			v.style.width = '100%'; v.style.height = '100%';
			v.style.background = '#000';
			v.style.zIndex = '1';
			v.style.display = 'none';
			// Once the video actually starts (modern autoplay, the muted fallback,
			// or a post-tap play), drop the overlay and mark the session active. On
			// iPad 1 'playing' won't fire until the gesture, so the overlay persists.
			v.addEventListener('playing', function () { playback.activated = true; hideTapStart(); });
			document.body.appendChild(v);
			playback.pvid = v;
		}
		return playback.pvid;
	}
	var HARD_SEEK_MS = 750; // drift beyond this is corrected with a seek, not a rate nudge
	                        // (must exceed typical seek+rebuffer latency or playback chases its own tail)
	var SEEK_COOLDOWN_MS = 2500; // min gap between hard seeks: a seek must be given
	                             // time to settle + establish playback before another,
	                             // else a slow/stalled element gets re-seeked every tick
	                             // and stays stuck at currentTime 0 (never plays).

	// Optional on-screen timing HUD. Open the page with ?tdbg to diagnose sync /
	// flashing on a device: live clock(el) vs video(ct), drift(err), look-ahead,
	// and a tick counter (rapidly climbing # == a re-render/flash loop). Element
	// is created lazily on first use (the <video> is in <body> by then). ES5-safe.
	if (/tdbg/.test(location.href)) {
		window._tdbg = function(pos, v, errorMs) {
			var el = document.getElementById('tdbg');
			if (!el) {
				if (!document.body) { return; }
				el = document.createElement('div'); el.id = 'tdbg';
				el.style.cssText = 'position:fixed;left:0;bottom:0;z-index:99999;' +
					'background:rgba(0,0,0,0.7);color:#0f0;font:12px monospace;' +
					'padding:3px 5px;white-space:pre;pointer-events:none;';
				document.body.appendChild(el);
				window._tdbgN = 0;
			}
			window._tdbgN++;
			var elapsed = GoTime.now() - playback.startEpoch;
			el.textContent = 'idx=' + (pos ? pos.index : '-') +
				' off=' + (pos ? Math.round(pos.offsetMs) : '-') +
				' ct=' + (v ? Math.round(v.currentTime * 1000) : '-') +
				' err=' + Math.round(errorMs) +
				' ahead=' + Math.round(playback.seekAheadMs) +
				' rs=' + (v ? v.readyState : '-') +
				' el=' + Math.round(elapsed) +
				' r=' + (window._mmRenderN || 0) + ' #' + window._tdbgN;
		};
	}

	// JS mirror of server.playlist_index — keep the two in sync.
	function playlistIndex(elapsedMs, durations, loop) {
		var total = 0, i;
		for (i = 0; i < durations.length; i++) { total += durations[i]; }
		if (total <= 0) { return null; }
		if (loop) { elapsedMs = ((elapsedMs % total) + total) % total; }
		else if (elapsedMs >= total) { return null; }
		if (elapsedMs < 0) { elapsedMs = 0; }
		var cum = 0;
		for (i = 0; i < durations.length; i++) {
			if (elapsedMs < cum + durations[i]) { return { index: i, offsetMs: elapsedMs - cum }; }
			cum += durations[i];
		}
		return { index: durations.length - 1, offsetMs: durations[durations.length - 1] };
	}

	function isVideoItem(file) {
		// Mirror server.isVideoItem (_VIDEO_EXTS). ES5-safe regex.
		return /\.(mp4|mov|m4v|webm|ogv)(\?|$)/i.test(file || '');
	}

	function showTapStart() { var el = document.getElementById('tapstart'); if (el) { el.style.display = 'block'; } }
	function hideTapStart() { var el = document.getElementById('tapstart'); if (el) { el.style.display = 'none'; } }

	// Called from the #tapstart overlay's tap handler — a real user gesture.
	// iOS-5 only begins LOADING a <video> from a gesture-triggered play(), and the
	// gesture is voided by any DOM mutation / async deferral before play(). So do
	// load()+play() FIRST and nothing else; the 'playing' listener (in
	// getPersistentVideo) dismisses the overlay, and the drift loop syncs position.
	function activatePlayback() {
		var v = getPersistentVideo();
		v.style.display = 'block';
		try { v.load(); } catch (e) {}
		try {
			var p = v.play();
			if (p && p['catch']) {
				p['catch'](function () { v.muted = true; var q = v.play(); if (q && q['catch']) { q['catch'](function () {}); } });
			}
		} catch (e) {}
		playback.activated = true;   // overlay auto-hides on the 'playing' event
		return false;
	}

	function showBlackout() { var el = document.getElementById('blackout'); if (el) { el.style.display = 'block'; } }
	function hideBlackout() { var el = document.getElementById('blackout'); if (el) { el.style.display = 'none'; } }

	function sendMsg(request, payload) {
		try { sock.send(generateMessage("SRV", request, payload)); } catch (e) {}
	}

	// Undo the calibrate view's <html> framing (8px border + window-16 sizing) and
	// its white page override, returning to the black playback background.
	function exitCalibrateView() {
		$('html').css({ width: '', height: '', border: '', position: '', 'z-index': '', overflow: '' });
		$('html, body').css('background-color', '');
		$('#canvas').css({ color: '' });
	}

	// Coordinated-start phase 1: buffer the first item and HOLD frame 0 (paused).
	// Report READY when buffered (and armed, for gesture devices). A gesture device
	// that is not yet armed reports NEEDS_ARM and, when the arming touch lands,
	// "arm-then-hold": let play() fire to consume the gesture, then pause back to 0
	// and send READY. The server's GO (PLAY with a future startEpoch) releases us.
	function prepareFirstItem(prepareId) {
		clearScript();
		var item = playback.items[0];
		if (!item) { sendMsg("READY", { prepareId: prepareId }); return; }
		if (item.playmode === 'SCRIPT' || !isVideoItem(item.file)) {
			sendMsg("READY", { prepareId: prepareId });   // no buffering / gesture needed
			return;
		}
		var v = getPersistentVideo();
		v.style.display = 'block'; v.style.opacity = '1'; v.loop = false; v.muted = false;
		$('#canvas').empty();
		playback.video = v; playback.videoIndex = 0; playback.videoSrc = item.file;
		var holdAtZero = function () {
			try { v.pause(); } catch (e) {}
			try { v.currentTime = 0; } catch (e) {}
		};
		var reportReady = function () { sendMsg("READY", { prepareId: prepareId }); };
		var onArmed = function () {            // 'playing' fired => gesture consumed
			playback.activated = true; hideTapStart();
			holdAtZero(); reportReady();
		};
		var afterLoad = function () {
			v.removeEventListener('loadedmetadata', afterLoad);
			holdAtZero();
			if (playback.activated) {
				reportReady();                 // already blessed: buffered + held
			} else {
				sendMsg("NEEDS_ARM", { prepareId: prepareId });   // ask the server to tap us
				v.addEventListener('playing', function once() { v.removeEventListener('playing', once); onArmed(); });
				showTapStart();                // a manual tap also works (activatePlayback -> play())
			}
		};
		if (v.getAttribute('src') !== item.file) {
			v.src = item.file; v.addEventListener('loadedmetadata', afterLoad); try { v.load(); } catch (e) {}
		} else if (v.readyState >= 1) {
			afterLoad();
		} else {
			v.addEventListener('loadedmetadata', afterLoad);
		}
	}

	function clearVideo() {
		if (playback.driftTimer) { clearInterval(playback.driftTimer); playback.driftTimer = null; }
		var v = playback.pvid;
		if (v && playback.activated && v.getAttribute('src')) {
			// Do NOT pause the blessed element between items. iOS-5 drops the
			// element's user-activation on pause, which re-locks playback so the
			// NEXT video's play() is blocked again (and, with activated already
			// true, showItem won't re-prompt) — the "video didn't start, no tap
			// prompt" bug. Instead keep it playing, muted and looping, but fully
			// transparent so the non-video item shows through it. showItem's video
			// branch restores opacity + audio. Mirrors stopPlayback's keep-alive.
			v.muted = true; v.loop = true; v.style.opacity = '0';
			var p = v.play(); if (p && p['catch']) { p['catch'](function () {}); }
		} else if (v) {
			// Not yet gesture-blessed (nothing to preserve): just hide it.
			try { v.pause(); } catch (e) {}
			v.style.display = 'none';
		}
		playback.video = null;
		playback.videoIndex = -1;
	}

	var _raf = window.requestAnimationFrame || window.webkitRequestAnimationFrame ||
		function(cb){ return setTimeout(cb, 16); };
	var _caf = window.cancelAnimationFrame || window.webkitCancelAnimationFrame ||
		function(id){ clearTimeout(id); };

	// Built-in animations: each is a PURE function of elapsed time (tMs) and canvas
	// size, so every display draws the same frame at the same shared-clock instant.
	var animations = {
		bouncingBalls: function(ctx, tMs, w, h) {
			var colors = ['#e74c3c', '#27ae60', '#2980b9', '#f1c40f'];
			var r = Math.max(12, Math.min(w, h) * 0.06), n = 4, i;
			for (i = 0; i < n; i++) {
				var px = (Math.sin(tMs / (900 + i * 220) + i) + 1) / 2;        // 0..1
				var py = (Math.sin(tMs / (700 + i * 180) + i * 1.7) + 1) / 2;  // 0..1
				ctx.fillStyle = colors[i % colors.length];
				ctx.beginPath();
				ctx.arc(r + px * (w - 2 * r), r + py * (h - 2 * r), r, 0, Math.PI * 2);
				ctx.fill();
			}
		}
	};

	function clearScript() {
		if (playback.scriptRaf) { _caf(playback.scriptRaf); playback.scriptRaf = null; }
		playback.scriptIndex = -1;
	}

	function runScriptLoop(canvas, name) {
		var ctx = canvas.getContext('2d');
		function frame() {
			if (!playback.active) { return; }
			var durations = [], k;
			for (k = 0; k < playback.items.length; k++) { durations.push(playback.items[k].duration); }
			var pos = playlistIndex(GoTime.now() - playback.startEpoch, durations, playback.loop);
			if (pos === null) { stopPlayback(); return; }
			if (pos.index !== playback.scriptIndex) { return; } // transition; renderPlayback handles it
			ctx.clearRect(0, 0, canvas.width, canvas.height);
			if (animations[name]) { animations[name](ctx, pos.offsetMs, canvas.width, canvas.height); }
			playback.scriptRaf = _raf(frame);
		}
		playback.scriptRaf = _raf(frame);
	}

	// Keep the active video aligned to the shared clock: a proportional playbackRate
	// controller for small drift, a hard seek for large drift (the latter is also the
	// iOS-5 path, where playbackRate may be ignored so error grows until it is seeked).
	function driftTick() {
		var v = playback.video;
		if (!v || !playback.active) { return; }
		// Should be playing but isn't (not a user PAUSE)? iOS-5 can drop the
		// element's user-activation across a stop/start, so a programmatic play()
		// gets blocked again. Retry it; if it still won't go, re-show the tap
		// prompt so a gesture can re-bless it. The 'playing' listener hides the
		// prompt once it actually starts (so modern displays never see it).
		if (v.paused && !playback.paused) {
			var pr = v.play();
			if (pr && pr['catch']) { pr['catch'](function () {}); }
			if (v.paused) { showTapStart(); }
			return;
		}
		// Leave the video alone while it is still seeking or lacks playable data
		// (readyState < HAVE_FUTURE_DATA). Correcting mid-seek restarts buffering,
		// so during startup the video can never establish playback — it gets
		// re-seeked every tick and stays stuck at currentTime 0. Let it buffer to
		// a playable state, then sync.
		if (v.seeking || v.readyState < 3) { return; }
		var durations = [], i;
		for (i = 0; i < playback.items.length; i++) { durations.push(playback.items[i].duration); }
		var pos = playlistIndex(GoTime.now() - playback.startEpoch, durations, playback.loop);
		if (pos === null || pos.index !== playback.videoIndex) { return; }
		var errorMs = v.currentTime * 1000 - pos.offsetMs;   // <0 => BEHIND clock, >0 => AHEAD
		// A prior catch-up seek just settled: tune the look-ahead from the residual
		// so the next catch-up lands closer (we only seek-ahead when behind, below).
		if (playback.seekPending) {
			playback.seekPending = false;
			playback.seekAheadMs -= errorMs * 0.5;
			if (playback.seekAheadMs < 0) { playback.seekAheadMs = 0; }
			if (playback.seekAheadMs > 1500) { playback.seekAheadMs = 1500; }
		}
		// Rate-limit hard seeks so a seek can settle + establish playback before the
		// next one (otherwise a slow/stalled element is re-seeked every tick and
		// never plays). Between seeks, playbackRate handles the drift.
		var nowMs = GoTime.now();
		var canSeek = (nowMs - playback.lastSeekAt) > SEEK_COOLDOWN_MS;
		var tgtMs = null;
		if (canSeek && errorMs < -HARD_SEEK_MS) {
			// Too far BEHIND: seek ahead by the learned seek latency so we land on
			// the clock (a slow device's seek takes ~latency to settle).
			tgtMs = pos.offsetMs + playback.seekAheadMs;
			playback.seekPending = true;
		} else if (canSeek && errorMs > HARD_SEEK_MS) {
			// Too far AHEAD: seek to the EXACT target (no look-ahead). On a slow
			// device the seek lands ~latency later, i.e. on/behind the clock — never
			// ahead. Don't tune the look-ahead from this (it's not a catch-up).
			tgtMs = pos.offsetMs;
		}
		if (tgtMs !== null) {
			var maxMs = ((v.duration || (durations[pos.index] / 1000)) * 1000) - 50;
			if (tgtMs > maxMs) { tgtMs = maxMs; }
			if (tgtMs < 0) { tgtMs = 0; }
			try { v.currentTime = tgtMs / 1000; } catch (e) {}
			v.playbackRate = 1;
			playback.lastSeekAt = nowMs;
		} else {
			var rate = 1 - errorMs / 2000;
			if (rate < 0.85) { rate = 0.85; }
			if (rate > 1.15) { rate = 1.15; }
			v.playbackRate = rate;
		}
		if (window._tdbg) { window._tdbg(pos, v, errorMs); }
	}

	function startDriftLoop() {
		if (playback.driftTimer) { clearInterval(playback.driftTimer); }
		playback.driftTimer = setInterval(driftTick, 500);
	}

	function showItem(i, offsetMs) {
		clearVideo();
		clearScript();
		hideTapStart();   // only video items that still need a gesture re-show it
		var item = playback.items[i];
		if (!item) { return; }
		$('#canvas').css('background-color', item.backgroundColor || '#000000');
		if (item.playmode === 'SCRIPT') {
			var cnv = document.createElement('canvas');
			cnv.width = window.innerWidth; cnv.height = window.innerHeight;
			cnv.style.width = '100%'; cnv.style.height = '100%';
			$('#canvas').empty();
			document.getElementById('canvas').appendChild(cnv);
			playback.scriptIndex = i;
			runScriptLoop(cnv, item.file);
		} else if (isVideoItem(item.file)) {
			var v = getPersistentVideo();
			v.style.display = 'block';   // viewport-locked (fixed 100%/100%) in <body>
			v.style.opacity = '1';       // restore visibility (clearVideo keep-alive set it to 0)
			v.loop = false;              // playlist advances via renderPlayback, not element loop
			v.muted = false;             // restore audio (keep-alive muted it); fallback re-mutes if blocked
			hideBlackout();              // drop the 'stopped' cover
			$('#canvas').empty();        // clear any prior image/script content
			playback.video = v;
			playback.videoIndex = i;
			var seekAndPlay = function() {
				try { v.currentTime = (offsetMs || 0) / 1000; } catch (e) {}
				var p = v.play();
				if (p && p['catch']) {
					// Modern browsers: unmuted autoplay may be blocked -> fall back to
					// muted so it still starts. (iPad 1's play() returns no promise, so
					// this never runs there — it relies on the tap-to-start gesture.)
					p['catch'](function() {
						v.muted = true;
						var p2 = v.play();
						if (p2 && p2['catch']) { p2['catch'](function() {}); }
					});
				}
			};
			if (item.file !== playback.videoSrc) {
				// New clip: (re)load, then seek+play once metadata is ready.
				playback.videoSrc = item.file;
				v.src = item.file;
				var once = function() { v.removeEventListener('loadedmetadata', once); seekAndPlay(); };
				v.addEventListener('loadedmetadata', once);
				try { v.load(); } catch (e) {}
			} else if (v.readyState >= 1) {
				// Same clip already loaded. Only (re)seek if it's paused or
				// meaningfully off the target. A redundant PLAY/renderPlayback for
				// the clip already playing (e.g. a reconnect re-sending PLAY) must
				// NOT re-seek — on the iPad that rebuffers and visibly flashes the
				// clip. A genuine loop restart still seeks (offset ~0 vs currentTime
				// near the end is a large diff).
				var driftMs = Math.abs(v.currentTime * 1000 - (offsetMs || 0));
				if (v.paused || driftMs > HARD_SEEK_MS) { seekAndPlay(); }
			} else {
				var once2 = function() { v.removeEventListener('loadedmetadata', once2); seekAndPlay(); };
				v.addEventListener('loadedmetadata', once2);
			}
			startDriftLoop();
			if (!playback.activated) { showTapStart(); }   // need a gesture to start on iOS
		} else {
			$('#canvas').html('<img src="' + item.file + '" style="max-width:100%; max-height:100%;">');
		}
	}

	function pausePlayback() {
		playback.paused = true;
		if (playback.timer) { clearTimeout(playback.timer); playback.timer = null; }
		if (playback.startTimer) { clearTimeout(playback.startTimer); playback.startTimer = null; }
		if (playback.driftTimer) { clearInterval(playback.driftTimer); playback.driftTimer = null; }
		if (playback.video) { try { playback.video.pause(); } catch (e) {} }
	}

	function stopPlayback() {
		playback.active = false;
		playback.paused = false;
		if (playback.timer) { clearTimeout(playback.timer); playback.timer = null; }
		if (playback.startTimer) { clearTimeout(playback.startTimer); playback.startTimer = null; }
		if (playback.driftTimer) { clearInterval(playback.driftTimer); playback.driftTimer = null; }
		clearScript();
		$('#canvas').empty();
		var v = playback.pvid;
		if (v && playback.activated && v.getAttribute('src')) {
			// Keep the blessed element ALIVE — playing, muted, looping, behind a
			// black cover — instead of pausing it. iOS drops the element's
			// user-activation on pause, which would force a new tap on the next
			// start; keeping it playing preserves it (audio is muted, screen is
			// black, so it reads as 'stopped').
			v.muted = true; v.loop = true; v.style.display = 'block';
			var p = v.play(); if (p && p['catch']) { p['catch'](function () {}); }
			showBlackout();
		} else if (v) {
			try { v.pause(); } catch (e) {}
			v.style.display = 'none';
			showBlackout();
		}
		playback.video = null;
		playback.videoIndex = -1;
	}

	// Frame-accurate, self-correcting render loop: each transition recomputes the
	// current item from the shared clock and schedules the exact next boundary.
	function renderPlayback() {
		if (!playback.active || playback.paused) { return; }
		window._mmRenderN = (window._mmRenderN || 0) + 1;   // tdbg: re-render/flash counter
		if (playback.timer) { clearTimeout(playback.timer); playback.timer = null; }
		var durations = [], i;
		for (i = 0; i < playback.items.length; i++) { durations.push(playback.items[i].duration); }
		var elapsed = GoTime.now() - playback.startEpoch;
		var pos = playlistIndex(elapsed, durations, playback.loop);
		if (pos === null) { stopPlayback(); return; }
		showItem(pos.index, pos.offsetMs);
		var msToNext = durations[pos.index] - pos.offsetMs;
		if (msToNext < 16) { msToNext = 16; } // floor to avoid a 0ms busy loop
		playback.timer = setTimeout(renderPlayback, msToNext);
	}
	var _phaseHistory = [];     // recent tick phases: signed ms from nearest second
	var _lastTickAt = 0;        // wall-clock time of the last synchronized tick
	var SETTLE_SAMPLES = 5;
	var SETTLE_STDDEV_MS = 10;  // beat is steady (low jitter) ...
	var SETTLE_MEAN_MS = 20;    // ... and centered on the second start

	function recordTickPhase(currentTime) {
		var ph = currentTime % 1000;
		if (ph > 500) { ph -= 1000; } // e.g. 998 -> -2 (2ms before the second)
		_phaseHistory.push(ph);
		if (_phaseHistory.length > SETTLE_SAMPLES) { _phaseHistory.shift(); }
	}

	// "settled" = the synchronized beat has stopped wandering (low std dev) AND
	// sits around the second start (mean near zero). Stricter than isSynced(),
	// which only checks the tick isn't badly late.
	function clockSettled() {
		var n = _phaseHistory.length, i, sum = 0;
		if (n < SETTLE_SAMPLES) { return false; }
		for (i = 0; i < n; i++) { sum += _phaseHistory[i]; }
		var mean = sum / n;
		var sq = 0;
		for (i = 0; i < n; i++) { var d = _phaseHistory[i] - mean; sq += d * d; }
		var stddev = Math.sqrt(sq / n);
		return (stddev <= SETTLE_STDDEV_MS) && (Math.abs(mean) <= SETTLE_MEAN_MS);
	}

	// Restart the one-shot beat animation. Whoever calls this sets the pulse
	// phase; driving it from the synchronized tick pulses all displays together.
	function triggerPulse() {
		var el = document.getElementById('heartbeat');
		if (!el) { return; }
		el.style.webkitAnimationName = 'none';
		el.style.animationName = 'none';
		void el.offsetWidth; // force reflow so the animation can restart
		el.style.webkitAnimationName = 'hb-pulse';
		el.style.animationName = 'hb-pulse';
	}

	// Heartbeat indicator color: red (disconnected) -> orange (connected, clock
	// not settled) -> yellow (clock settled on the second) -> green (settled +
	// media cached/ready).
	function updateHeartbeat() {
		var el = document.getElementById('heartbeat');
		if (!el) { return; }
		var connected = (typeof sock !== 'undefined' && sock &&
			typeof SockJS !== 'undefined' && sock.readyState === SockJS.OPEN);
		var settled = clockSettled();
		var cls = 'hb-red';
		if (connected) {
			if (settled && mediaReady) { cls = 'hb-green'; }
			else if (settled) { cls = 'hb-yellow'; }
			else { cls = 'hb-orange'; }
		}
		el.className = cls;
		// If the synchronized tick isn't driving the beat (no recent tick, e.g.
		// before the clock starts ticking), beat locally so the dot still pulses.
		if (Date.now() - _lastTickAt > 1500) { triggerPulse(); }
	}
	setInterval(updateHeartbeat, 1000);
	updateHeartbeat();

	// Auto-reconnect watchdog. Runs on its own fixed timer (NOT the GoTime tick,
	// which stops when the server is unreachable) so a display recovers on its
	// own after a server restart / network blip. Reconnect only when the socket
	// is gone or closed; stay hands-off while it is still CONNECTING so we never
	// spawn overlapping SockJS handshakes. ES5 — 1st-gen iPad / iOS 5 safe.
	function reconnectWatchdog() {
		if (typeof SockJS === 'undefined') { return; }
		if (sock == null ||
			(sock.readyState !== SockJS.OPEN && sock.readyState !== SockJS.CONNECTING)) {
			log('reconnect watchdog: re-opening socket...');
			mosiacMeshConnect(mosiacMeshCallback);
		}
	}
	setInterval(reconnectWatchdog, 3000);

	function mosiacMeshCallback(data_obj)
	{
		log('Received: ' + data_obj);
		
		if(data_obj.DEST == getUDID() || data_obj.DEST == 'ALL')
		{
			if(data_obj.REQUEST == "PRELOAD")
			{
				mediaSequence = data_obj.PAYLOAD.items || [];
				mediaReady = false;
				var total = mediaSequence.length, settled = 0, j;
				if(total === 0) { mediaReady = true; updateHeartbeat(); }
				var onSettled = function() {
					settled++;
					if(settled >= total) { mediaReady = true; updateHeartbeat(); }
				};
				for(j = 0; j < mediaSequence.length; j++)
				{
					if(mediaSequence[j].playmode === 'SCRIPT')
					{
						onSettled(); // a script item has nothing to fetch
					}
					else if(isVideoItem(mediaSequence[j].file))
					{
						var vp = document.createElement('video');
						vp.preload = 'auto';
						vp.muted = true;
						var onceV = function() {
							if (this._hbDone) { return; }
							this._hbDone = true;
							onSettled();
						};
						vp.addEventListener('canplaythrough', onceV);
						vp.addEventListener('error', onceV);
						vp.addEventListener('stalled', onceV);
						vp.src = mediaSequence[j].file;
					}
					else
					{
						var img = new Image();
						img.onload = img.onerror = onSettled;
						img.src = mediaSequence[j].file;
					}
				}
			}
			else if(data_obj.REQUEST == "IDENTIFY")
			{
				blink = false;
				$('#canvas').text(data_obj.PAYLOAD).css('font-size','8vw');
			}
			else if(data_obj.REQUEST == "CALIBRATE")
			{
				blink = false;
				// The page background is black for video playback, but calibration
				// needs a WHITE screen field so the <html> 8px black border reads as
				// the screen-perimeter band against white. Force the page white here;
				// PLAY/stop revert it to black.
				$('html, body').css('background-color', '#ffffff');
				$('#canvas').css({'background-color': 'white', 'color': 'black'});
				$('#canvas').text("");
				var image = new Image();
				image.src = 'http://' + window.location.host + '/media/' + udid + "/aruco.png?"+GoTime.now();
				
				$('#canvas').hide();
				$('#canvas').empty();
				$('#canvas').prepend(image);
				image.addEventListener('load', function() {$('#canvas').show();});
				
				$("html").css({
					width: $(window).width() -  16, // subtract twice the thickness
					height: $(window).height() - 16, // of the border from each dimension
					border: '8px solid black',
					'z-index': '10',
					position: 'relative',
					overflow: 'hidden'
				});
				// Report the CURRENT viewport size so calibration reconstructs the
				// screen from the marker using the dims actually being photographed
				// (the page may have been registered before going full screen).
				if (window._mmReportCanvas) { window._mmReportCanvas(); }
			}
			else if(data_obj.REQUEST == "PREPARE")
			{
				// Phase 1 of coordinated start: buffer + HOLD frame 0, then report
				// READY (or NEEDS_ARM). Do NOT start the clock — the GO (a PLAY with a
				// future startEpoch) releases us at the shared instant.
				blink = false;
				exitCalibrateView();
				hideBlackout();
				playback.items = data_obj.PAYLOAD.items || [];
				playback.loop = !!data_obj.PAYLOAD.loop;
				playback.active = false;
				playback.paused = false;
				prepareFirstItem(data_obj.PAYLOAD.prepareId);
			}
			else if(data_obj.REQUEST == "PLAY")
			{
				blink = false;
				exitCalibrateView();   // undo calibrate <html> framing + white page
				hideBlackout();        // lift the 'stopped' cover from a prior keep-alive
				playback.items = data_obj.PAYLOAD.items || [];
				playback.startEpoch = data_obj.PAYLOAD.startEpoch;
				playback.loop = !!data_obj.PAYLOAD.loop;
				playback.active = true;
				playback.paused = false;
				if (playback.startTimer) { clearTimeout(playback.startTimer); playback.startTimer = null; }
				var _delay = playback.startEpoch - GoTime.now();
				// Defer ONLY for a plausible coordinated GO (the start epoch is at most
				// ~RELEASE_LEAD_MS ahead). A large delay means the clock isn't synced
				// yet (e.g. just reconnected) or the epoch is stale; a <=0 delay is a
				// past epoch (late-join / resume / reconnect). Both start immediately so
				// we never hang waiting on a bogus future time.
				if (_delay > 0 && _delay < 3000) {
					// Holding frame 0 from PREPARE — release at the shared start epoch.
					playback.startTimer = setTimeout(function () { renderPlayback(); }, _delay);
				} else {
					renderPlayback();
				}
			}
			else if(data_obj.REQUEST == "STOP")
			{
				stopPlayback();
			}
			else if(data_obj.REQUEST == "PAUSE")
			{
				pausePlayback();
			}
		}
	}

	$.fn.center = function () {
	   this.css("position","absolute");
	   this.css("top", ( $(window).height() - this.height() ) / 2  + "px");
	   this.css("left", ( $(window).width() - this.width() ) / 2 + "px");
	   return this;
	}

	mosiacMeshConnect(mosiacMeshCallback);
  </script>
  <style>
	/* Full-bleed black page: kills the default 8px body margin (white strip at
	   the top/edges) and any white background behind the video/UI. */
	html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
	.canvas {
		width: 100%;
		-webkit-transform: translateX(-50%) translateY(-50%);
		transform: translateX(-50%) translateY(-50%);
		position: absolute; /*or fixed*/
		left: 50%;
		top: 50%;
		text-align: center;
	}
	/* Heartbeat status indicator (shaded sphere, top-right) */
	#heartbeat {
		position: fixed;
		top: 10px;
		right: 10px;
		width: 20px;
		height: 20px;
		border-radius: 50%;
		z-index: 9999;
		-webkit-box-shadow: inset -3px -3px 5px rgba(0,0,0,0.45), 0 0 4px rgba(0,0,0,0.4);
		box-shadow: inset -3px -3px 5px rgba(0,0,0,0.45), 0 0 4px rgba(0,0,0,0.4);
		/* One-shot 1s beat, (re)triggered each synchronized timer tick so all
		   displays pulse together (see triggerPulse / tickcallback). Falls back
		   to the local 1s refresh before the clock is synced. */
		-webkit-animation-name: none;
		animation-name: none;
		-webkit-animation-duration: 1s;
		animation-duration: 1s;
		-webkit-animation-timing-function: ease-out;
		animation-timing-function: ease-out;
		-webkit-animation-iteration-count: 1;
		animation-iteration-count: 1;
	}
	@-webkit-keyframes hb-pulse {
		0%   { -webkit-transform: scale(1.0);  opacity: 0.85; }
		20%  { -webkit-transform: scale(1.28); opacity: 1; }
		100% { -webkit-transform: scale(1.0);  opacity: 0.85; }
	}
	@keyframes hb-pulse {
		0%   { transform: scale(1.0);  opacity: 0.85; }
		20%  { transform: scale(1.28); opacity: 1; }
		100% { transform: scale(1.0);  opacity: 0.85; }
	}
	/* solid background-color is the iOS-5 fallback if radial-gradient is unsupported */
	.hb-red {
		background-color: #d63a2a;
		background: -webkit-radial-gradient(32% 30%, circle, #ff9080, #b21f0f 78%);
		background: radial-gradient(circle at 32% 30%, #ff9080, #b21f0f 78%);
	}
	.hb-orange {
		background-color: #e07b1a;
		background: -webkit-radial-gradient(32% 30%, circle, #ffc080, #c25e00 78%);
		background: radial-gradient(circle at 32% 30%, #ffc080, #c25e00 78%);
	}
	.hb-yellow {
		background-color: #e6c200;
		background: -webkit-radial-gradient(32% 30%, circle, #fff39a, #c8a400 78%);
		background: radial-gradient(circle at 32% 30%, #fff39a, #c8a400 78%);
	}
	.hb-green {
		background-color: #1f9d4d;
		background: -webkit-radial-gradient(32% 30%, circle, #9bf0a0, #137a37 78%);
		background: radial-gradient(circle at 32% 30%, #9bf0a0, #137a37 78%);
	}
  </style>
</head>
<body>
	<div id="heartbeat" class="hb-red"></div>
	<div id="canvas" class="canvas"></div>
	<!-- iOS needs a user gesture to start <video>; this full-screen overlay is the
	     tap target (a person or the gesture/SSH script taps it once per session).
	     Inline handlers + px units for 1st-gen iPad / iOS 5 compatibility. -->
	<div id="tapstart" onclick="return activatePlayback();" ontouchend="return activatePlayback();" ontouchstart="return activatePlayback();"
	     style="display:none; position:fixed; left:0; top:0; width:100%; height:100%; z-index:1000;
	            background:#000; color:#fff; text-align:center; font-size:28px; cursor:pointer;">
		<div style="margin-top:42%;">&#9658; Tap to start</div>
	</div>
	<!-- 'Stopped' cover: black screen over the persistent video, which is kept
	     playing (muted, looping) behind it to preserve iOS user-activation. -->
	<div id="blackout" style="display:none; position:fixed; left:0; top:0; width:100%; height:100%; z-index:2; background:#000;"></div>
	<div id="preload" class="preload"></div>
</body>
</html>
