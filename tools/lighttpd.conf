## /etc/lighttpd/lighttpd.conf  -- MosaicMesh per-iPad media cache
##
## Deployed by tools/onboard_devices.ps1 step 5.4d via scp. Edit this
## file rather than the PowerShell script -- the earlier inline-heredoc
## approach lost double-quote escaping during PowerShell-> ssh -> bash,
## leaving lighttpd unable to parse its own config.
##
## Bound to 127.0.0.1 only so the cache is never LAN-accessible.
## Document root is the MosaicMeshCache dir where the central server
## scp's per-iPad rendered segments after each render completes.
##
## See docs/superpowers/specs/2026-06-03-media-cache-design.md

server.modules = ( "mod_indexfile", "mod_dirlisting", "mod_staticfile" )
server.document-root = "/var/mobile/Media/MosaicMeshCache/"
server.bind = "127.0.0.1"
server.port = 8080
server.errorlog = "/var/log/lighttpd-error.log"
server.pid-file = "/var/run/lighttpd.pid"
dir-listing.activate = "disable"

mimetype.assign = (
    ".mp4"  => "video/mp4",
    ".m4v"  => "video/x-m4v",
    ".mov"  => "video/quicktime",
    ".jpg"  => "image/jpeg",
    ".png"  => "image/png",
    ".html" => "text/html",
    ".js"   => "application/javascript",
    ".css"  => "text/css",
    ""      => "application/octet-stream"
)

index-file.names = ( "index.html" )
