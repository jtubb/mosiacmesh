<head>
  <link href="/js/video-js.css" rel="stylesheet" />

  <!-- If you'd like to support IE8 (for Video.js versions prior to v7) -->
  <script src="/js/videojs-ie8.min.js"></script>
  <script src="/js/jquery.min.js"></script>
</head>

<body>
  <div>
	<video id="my-player" class="video-js" width="800" height="600" preload="auto" muted="muted" poster="http://vjs.zencdn.net/v/oceans.png" controls>
      <source src="/media/sample-mp4-video.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>

  <script src="/js/video.min.js"></script>
  <script>
	$(document).ready(function () {
		/*var options = {
			src:"/media/sample-mp4-video.mp4",
			preload:"auto",
			width:800,
			height:600,
			muted:true,
			loop:false,
			controls:true
		};*/

		var myPlayer = videojs('my-player');

		//myPlayer.src({type: 'video/mp4', src: '/media/sample-mp4-video.mp4'});
		myPlayer.ready(function() {
			myPlayer.requestFullscreen();
			myPlayer.play();
		});
		myPlayer.on('ended', function() {
			videojs.log('Awww...over so soon?!');
		});
	});
  </script>
</body>
